<style>
  :root{
    --bg:#F5F4F5;
    --paper:#FFFFFF;
    --ink:#171717;
    --grey:#777777;
    --light:#F5F4F5;
    --border:#E8E8E8;
    --red:#B3524A;      --red-bg:#FBEDEC;
    --green:#3F7A55;    --green-bg:#EAF5EE;
    --amber:#B4791F;    --amber-bg:#FCF3E3;
    --radius-card:20px;
    --radius-btn:12px;
    --radius-input:13px;
    --radius-badge:9px;
    --shadow-card:0 4px 20px rgba(0,0,0,0.04);
    --shadow-hover:0 10px 30px rgba(0,0,0,0.08);
    --t:180ms cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]{
    --bg:#0F0F10;
    --paper:#171718;
    --ink:#F5F5F5;
    --grey:#9A9A9E;
    --light:#0F0F10;
    --border:#2A2A2D;
    --red:#E0897E;      --red-bg:#3A2422;
    --green:#84C79A;    --green-bg:#1E3226;
    --amber:#E5B563;    --amber-bg:#3A2E18;
    --shadow-card:0 4px 20px rgba(0,0,0,0.25);
    --shadow-hover:0 10px 30px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t), color var(--t);
  }
  ::selection{background:rgba(23,23,23,0.12);}

  /* ---------- Shell layout: sidebar + main ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:224px;flex:none;background:var(--paper);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
    overflow-y:auto;transition:background var(--t), border-color var(--t);
  }
  .sidebar-logo{font-size:18px;font-weight:800;letter-spacing:-0.3px;padding:6px 10px 22px;color:var(--ink);}
  .sidebar-logo span{color:var(--grey);font-weight:500;}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:none;
    background:transparent;color:var(--grey);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;
    font-family:inherit;transition:background var(--t), color var(--t), transform 100ms ease;width:100%;
  }
  .nav-item .nav-icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item:hover{background:var(--bg);color:var(--ink);}
  .nav-item:active{transform:scale(0.97);}
  .nav-item.active{background:var(--bg);color:var(--ink);font-weight:700;}
  .sidebar-bottom{border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:2px;}

  .main{flex:1;min-width:0;}
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;padding:30px 36px 10px;gap:20px;flex-wrap:wrap;
  }
  .topbar h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-0.3px;color:var(--ink);}
  .topbar .subtitle{font-size:13px;color:var(--grey);margin:4px 0 0;font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .header-search{
    display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);
    border-radius:999px;padding:9px 16px;font-size:13px;color:var(--grey);min-width:220px;
    transition:border-color var(--t), box-shadow var(--t);
  }
  .header-search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,0.07);}
  .header-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;flex:1;color:var(--ink);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;
  }

  #content{padding:10px 36px 60px;max-width:1180px;}
  #content.fade-in{animation:fadeIn 200ms cubic-bezier(.22,.8,.25,1);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}

  h2.section-title{
    font-size:17px;font-weight:700;letter-spacing:-0.1px;
    margin:4px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--border);color:var(--ink);
  }

  /* Forms */
  label{display:block;font-weight:600;font-size:12px;letter-spacing:0.1px;margin:16px 0 6px;color:var(--grey);}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:11px 13px;border:1px solid var(--border);background:var(--paper);border-radius:var(--radius-input);
    font-size:14px;font-weight:500;color:var(--ink);font-family:inherit;transition:border-color var(--t), box-shadow var(--t);
  }
  input:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,0.07);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:150px;}

  /* Horizontal size boxes — used wherever sizes are entered/shown in a line */
  .size-box-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .size-box{
    border:1px solid var(--border);border-radius:14px;padding:9px;width:104px;position:relative;
    background:var(--paper);flex:none;box-shadow:var(--shadow-card);
  }
  .size-box input{padding:7px 4px;font-size:13px;text-align:center;border-radius:9px;}
  .size-box .sz-input{margin-bottom:5px;}
  .size-box .rm{
    position:absolute;top:-8px;right:-8px;width:20px;height:20px;font-size:12px;line-height:1;
    padding:0;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--paper);cursor:pointer;
  }
  .size-box .cf-label{display:block;font-weight:700;font-size:11px;text-align:center;margin-bottom:5px;color:var(--ink);}
  .add-size-btn{
    margin-top:6px;background:var(--paper);border:1px dashed var(--border);color:var(--ink);border-radius:var(--radius-btn);
    font-weight:600;padding:10px 14px;cursor:pointer;font-size:13px;transition:border-color var(--t), background var(--t), transform 100ms ease;
  }
  .add-size-btn:hover{border-color:var(--ink);}
  .add-size-btn:active{transform:scale(0.97);}

  .btn-primary{
    margin-top:20px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--radius-btn);
    font-weight:700;padding:13px 20px;cursor:pointer;font-size:13.5px;width:100%;
    transition:opacity var(--t), transform var(--t);
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-primary:active{transform:scale(0.99);}
  .msg{margin-top:12px;font-weight:600;font-size:13px;padding:11px 14px;border-radius:var(--radius-btn);background:var(--green-bg);color:var(--green);display:none;}
  .msg.show{display:block;}
  .msg.err{background:var(--red-bg);color:var(--red);}

  /* Ticket card — used for Cutting Issue priority queue and Daily Schedule */
  .ticket{
    border:1px solid var(--border);border-radius:var(--radius-card);margin-bottom:14px;position:relative;
    background:var(--paper);box-shadow:var(--shadow-card);overflow:hidden;transition:box-shadow var(--t);
  }
  .ticket:hover{box-shadow:var(--shadow-hover);}
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);
    padding:12px 16px;font-weight:700;font-size:13px;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);
  }
  .ticket-head .po{font-size:14px;}
  .ticket-head .country{
    background:var(--paper);color:var(--ink);padding:3px 10px;font-weight:700;border-radius:var(--radius-badge);
    border:1px solid var(--border);
  }
  .ticket-body{padding:14px 16px;}
  .status-pill{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-badge);
    margin-top:8px;
  }
  .status-pending{background:var(--red-bg);color:var(--red);}
  .status-progress{background:var(--amber-bg);color:var(--amber);}
  .status-done{background:var(--green-bg);color:var(--green);}

  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filters input,.filters select{flex:1;min-width:130px;}

  .empty{
    text-align:center;padding:44px 20px;color:var(--grey);font-weight:500;font-size:14px;
    border:1px dashed var(--border);border-radius:var(--radius-card);background:var(--paper);
  }

  .qty-badge{font-size:11px;font-weight:700;padding:2px 8px;border:1px solid var(--border);border-radius:var(--radius-badge);}

  .date-group{margin-bottom:20px;}
  .date-group h3{
    font-size:12.5px;font-weight:700;letter-spacing:0.2px;
    background:var(--bg);border-left:3px solid var(--ink);padding:9px 12px;margin:0 0 10px;color:var(--ink);
    border-radius:0 10px 10px 0;
  }

  .loading{text-align:center;padding:40px;font-weight:600;color:var(--grey);}

  /* Challan generated card */
  .challan-card{
    border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 16px;margin-bottom:10px;display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--paper);box-shadow:var(--shadow-card);
  }
  .challan-card .cno{font-weight:700;font-size:13px;}
  .challan-card .cmeta{font-size:11.5px;font-weight:500;color:var(--grey);}
  .print-btn{
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-weight:600;border-radius:var(--radius-btn);
    padding:8px 15px;cursor:pointer;font-size:12px;transition:opacity var(--t), transform 100ms ease;
  }
  .print-btn:hover{opacity:0.85;}
  .print-btn:active{transform:scale(0.97);}

  .challan-topbar{
    display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
    border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;margin-bottom:6px;
    background:var(--paper);box-shadow:var(--shadow-card);
  }

  /* Print overlay (toolbar is on-screen chrome; printed doc keeps its plain paper styling below) */
  .print-overlay{display:none;position:fixed;inset:0;background:#ffffff;z-index:9999;overflow:auto;opacity:0;transition:opacity 160ms ease;}
  .print-overlay.show{opacity:1;}
  .print-overlay.show{display:block;}
  .print-toolbar{
    position:sticky;top:0;background:var(--ink);padding:12px 18px;display:flex;gap:10px;
    justify-content:flex-end;z-index:2;
  }
  .print-toolbar button{
    font-weight:600;padding:9px 18px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);
    cursor:pointer;font-size:12.5px;border-radius:var(--radius-btn);transition:opacity var(--t);
  }
  .print-toolbar button:hover{opacity:0.85;}
  .print-toolbar button.close-btn{background:var(--ink);color:var(--paper);}

  /* ---------- Login screen (H&M Traceability) ----------
     Self-contained: uses its own tokens so the app's light/dark theme never changes its look.
     Background photo is defined as --lg-bg-image in the <style id="login-bg"> block in <head>. */
  .login-screen{
    --lg-burgundy:#7A263A; --lg-burgundy-deep:#5D1B2D; --lg-charcoal:#252525; --lg-warm:#FCFBF8;
    --lg-grey:#8A8A8A; --lg-soft:#6A6562; --lg-border:#E7E2DF; --lg-error:#B42318;
    --lg-ease:200ms cubic-bezier(.4,0,.2,1);
    position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
    overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
    color:var(--lg-charcoal);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:#F3F1EE;
    background-image:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)),var(--lg-bg-image);
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }
  /* Portrait screens: shift the crop right so the burgundy notebook stays in frame */
  @media (max-aspect-ratio:1/1){ .login-screen{background-position:86% center;} }
  .login-screen [hidden]{display:none !important;}

  .login-screen .lg-main{flex:1 0 auto;display:flex;padding:28px 20px 8px;}
  .login-screen .lg-card{
    width:100%;max-width:420px;margin:auto;padding:40px 36px 26px;
    background:rgba(252,251,248,.80);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.7);border-radius:20px;
    box-shadow:0 1px 2px rgba(37,37,37,.05),0 18px 48px -16px rgba(70,20,32,.22);
    animation:lgIn 420ms cubic-bezier(.22,.8,.25,1) both;
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .login-screen .lg-card{background:rgba(252,251,248,.96);}
  }
  @keyframes lgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* Brand */
  .login-screen .lg-brand{text-align:center;}
  .login-screen .lg-brand-name{margin:0;display:flex;flex-direction:column;align-items:center;font-weight:400;}
  .login-screen .lg-hm{
    font-family:'Playfair Display','Bodoni 72',Didot,Georgia,'Times New Roman',serif;
    font-weight:700;font-size:48px;line-height:1;letter-spacing:-.015em;color:var(--lg-burgundy-deep);
  }
  .login-screen .lg-trace{
    margin-top:10px;padding-left:.46em;font-size:11.5px;font-weight:600;letter-spacing:.46em;
    text-transform:uppercase;color:var(--lg-charcoal);
  }
  .login-screen .lg-descriptor{
    margin:14px 0 0;padding-left:.2em;font-size:10.5px;font-weight:500;letter-spacing:.2em;line-height:1.6;
    text-transform:uppercase;color:var(--lg-soft);text-wrap:balance;
  }

  /* Welcome */
  .login-screen .lg-welcome{margin-top:26px;padding-top:26px;border-top:1px solid var(--lg-border);}
  .login-screen .lg-welcome h2{margin:0;font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.01em;color:var(--lg-charcoal);}
  .login-screen .lg-welcome p{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--lg-soft);}

  /* Fields */
  .login-screen .lg-form{margin-top:22px;}
  .login-screen .lg-field + .lg-field{margin-top:16px;}
  .login-screen .lg-label{display:block;margin:0 0 7px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--lg-charcoal);}
  .login-screen .lg-control{position:relative;}
  .login-screen .lg-icon{
    position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);pointer-events:none;
    fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
    color:var(--lg-grey);transition:color var(--lg-ease);
  }
  .login-screen .lg-control:focus-within .lg-icon{color:var(--lg-burgundy);}
  .login-screen .lg-input{
    display:block;width:100%;height:52px;padding:0 16px 0 44px;margin:0;
    font-family:inherit;font-size:16px;font-weight:500;line-height:1.2;color:var(--lg-charcoal);
    background:rgba(255,255,255,.92);border:1px solid var(--lg-border);border-radius:12px;
    outline:2px solid transparent;outline-offset:2px;box-shadow:none;
    transition:border-color var(--lg-ease),box-shadow var(--lg-ease),background-color var(--lg-ease);
  }
  .login-screen .lg-input--pw{padding-right:52px;}
  .login-screen .lg-input::placeholder{color:#7C7773;font-weight:400;opacity:1;}
  .login-screen .lg-input:hover{border-color:#D3CBC7;}
  .login-screen .lg-input:focus{background:#fff;border-color:var(--lg-burgundy);box-shadow:0 0 0 4px rgba(122,38,58,.13);}
  .login-screen .lg-input[aria-invalid="true"]{border-color:var(--lg-error);}
  .login-screen .lg-input[aria-invalid="true"]:focus{box-shadow:0 0 0 4px rgba(180,35,24,.14);}
  .login-screen .lg-input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:var(--lg-charcoal);}
  .login-screen .lg-error{margin:6px 0 0;font-size:12.5px;line-height:1.4;color:var(--lg-error);}

  .login-screen .lg-toggle{
    position:absolute;right:6px;top:50%;width:40px;height:40px;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:10px;
    background:transparent;color:var(--lg-grey);cursor:pointer;
    outline:2px solid transparent;outline-offset:1px;transition:color var(--lg-ease),background-color var(--lg-ease),box-shadow var(--lg-ease);
  }
  .login-screen .lg-toggle:hover{color:var(--lg-charcoal);background:rgba(37,37,37,.05);}
  .login-screen .lg-toggle:focus-visible{color:var(--lg-burgundy);box-shadow:0 0 0 3px rgba(122,38,58,.25);}
  .login-screen .lg-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .login-screen .lg-toggle .lg-eye-off{display:none;}
  .login-screen .lg-toggle.is-visible .lg-eye{display:none;}
  .login-screen .lg-toggle.is-visible .lg-eye-off{display:block;}

  /* Remember me + forgot password */
  .login-screen .lg-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin:6px 0 10px;}
  .login-screen .lg-check{display:inline-flex;align-items:center;gap:9px;min-height:44px;margin:0;font-size:14px;font-weight:500;letter-spacing:0;color:var(--lg-charcoal);cursor:pointer;user-select:none;}
  .login-screen .lg-check input{
    -webkit-appearance:none;appearance:none;display:grid;place-content:center;flex:none;
    width:18px;height:18px;margin:0;border:1.5px solid #C9C1BC;border-radius:5px;background:#fff;cursor:pointer;
    outline:2px solid transparent;outline-offset:2px;transition:background-color var(--lg-ease),border-color var(--lg-ease),box-shadow var(--lg-ease);
  }
  .login-screen .lg-check input::after{
    content:"";width:10px;height:10px;background:#fff;transform:scale(0);transition:transform 160ms cubic-bezier(.4,0,.2,1);
    clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);
  }
  .login-screen .lg-check input:checked{background:var(--lg-burgundy);border-color:var(--lg-burgundy);}
  .login-screen .lg-check input:checked::after{transform:scale(1);}
  .login-screen .lg-check input:hover{border-color:var(--lg-burgundy);}
  .login-screen .lg-check input:focus-visible{box-shadow:0 0 0 4px rgba(122,38,58,.22);}
  .login-screen .lg-link{
    margin:0;padding:12px 2px;border:0;border-radius:6px;background:none;font:inherit;font-size:14px;font-weight:600;
    color:var(--lg-burgundy);cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;
    outline:2px solid transparent;outline-offset:1px;transition:color var(--lg-ease),text-decoration-color var(--lg-ease),box-shadow var(--lg-ease);
  }
  .login-screen .lg-link:hover{color:var(--lg-burgundy-deep);text-decoration-color:currentColor;}
  .login-screen .lg-link:focus-visible{box-shadow:0 0 0 3px rgba(122,38,58,.25);}

  /* Message banner (auth errors / notices) */
  .login-screen .lg-alert{margin:0 0 12px;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.45;border:1px solid transparent;}
  .login-screen .lg-alert--error{background:#FDF1EF;border-color:#F2CAC5;color:#8A1C14;}
  .login-screen .lg-alert--info{background:rgba(255,255,255,.7);border-color:var(--lg-border);color:var(--lg-charcoal);}

  /* Primary button */
  .login-screen .lg-submit{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;margin:0;padding:0 20px;
    border:0;border-radius:12px;background:var(--lg-burgundy);color:#fff;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:600;line-height:1;letter-spacing:.02em;
    box-shadow:0 1px 2px rgba(93,27,45,.28);
    outline:2px solid transparent;outline-offset:3px;
    transition:background-color var(--lg-ease),box-shadow var(--lg-ease),transform 120ms ease;
  }
  .login-screen .lg-submit:hover{background:var(--lg-burgundy-deep);box-shadow:0 10px 22px -10px rgba(93,27,45,.6);}
  .login-screen .lg-submit:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(93,27,45,.28);}
  .login-screen .lg-submit:focus-visible{outline-color:var(--lg-burgundy);}
  .login-screen .lg-arrow{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--lg-ease);}
  .login-screen .lg-submit:hover .lg-arrow{transform:translateX(3px);}
  .login-screen .lg-spinner{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:lgSpin .8s linear infinite;}
  @keyframes lgSpin{to{transform:rotate(360deg);}}
  .login-screen .lg-submit.is-loading{background:var(--lg-burgundy-deep);cursor:progress;pointer-events:none;}
  .login-screen .lg-submit.is-loading .lg-spinner{display:block;}
  .login-screen .lg-submit.is-loading .lg-arrow{display:none;}

  /* Card + page footers */
  .login-screen .lg-secure{
    display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 0;padding-top:18px;
    border-top:1px solid var(--lg-border);font-size:12.5px;color:var(--lg-soft);
  }
  .login-screen .lg-secure svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .login-screen .lg-footer{flex:none;padding:14px 20px 20px;text-align:center;font-size:12px;letter-spacing:.01em;color:#57514E;}

  /* Small screens */
  @media (max-width:480px){
    .login-screen .lg-main{padding:20px 14px 6px;}
    .login-screen .lg-card{padding:30px 22px 20px;border-radius:18px;background:rgba(252,251,248,.76);}
    .login-screen .lg-hm{font-size:42px;}
    .login-screen .lg-welcome{margin-top:22px;padding-top:22px;}
  }
  @media (max-width:380px){
    .login-screen .lg-descriptor{font-size:10px;letter-spacing:.14em;}
    .login-screen .lg-trace{letter-spacing:.38em;padding-left:.38em;}
  }
  @media (max-height:700px) and (min-width:481px){
    .login-screen .lg-card{padding-top:30px;padding-bottom:20px;}
    .login-screen .lg-hm{font-size:42px;}
    .login-screen .lg-welcome{margin-top:20px;padding-top:20px;}
    .login-screen .lg-form{margin-top:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .login-screen,.login-screen *,.login-screen *::before,.login-screen *::after{
      animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;
    }
    .login-screen .lg-spinner{display:none !important;}
  }

  .challan-doc{width:190mm;max-width:100%;margin:0 auto;padding:12mm;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;font-size:12px;background:#fff;}

  /* Shared letterhead header — used by the Challan, Order Sheet and Issued Cutting print documents */
  .cd-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:12px;border-bottom:2px solid #1f2430;}
  .cd-brand{display:flex;gap:10px;align-items:flex-start;}
  .cd-logo{
    width:38px;height:38px;border-radius:8px;background:#1f2430;color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:0.5px;
  }
  .cd-company{font-size:16px;font-weight:700;margin:0 0 2px;letter-spacing:0.2px;}
  .cd-address{font-size:10.5px;color:#555;margin:0 0 2px;}
  .cd-gst{font-size:10.5px;color:#555;font-weight:600;margin:0;}
  .cd-doc-meta{background:#f4f4f6;border-radius:8px;padding:9px 16px;min-width:160px;text-align:right;}
  .cd-doc-title{font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#1f2430;margin-bottom:6px;}
  .cd-doc-row{display:flex;justify-content:space-between;gap:16px;font-size:10.5px;margin:2px 0;color:#666;}
  .cd-doc-row b{color:#111;font-weight:700;}

  .cd-parties{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap;}
  .cd-parties>div{flex:1;min-width:140px;}
  .cd-label{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#9a9a9a;margin-bottom:3px;}
  .cd-value{font-size:11.5px;font-weight:600;color:#1a1a1a;}
  .cd-blank{font-weight:400;color:#aaa;border-bottom:1px solid #ccc;padding-bottom:3px;display:inline-block;min-width:95%;}

  table.challan-table{width:100%;border-collapse:collapse;margin-top:8px;}
  table.challan-table th{
    background:#1f2430;color:#fff;font-weight:600;font-size:10px;letter-spacing:0.3px;
    padding:7px 7px;text-align:center;border:none;
  }
  table.challan-table td{padding:6px 7px;font-size:11px;text-align:center;border:none;border-bottom:1px solid #ededed;}
  table.challan-table tbody tr:nth-child(even){background:#fafafa;}
  table.challan-table td.desc{text-align:left;font-weight:500;}
  .challan-doc .total-row td{font-weight:700;border-top:2px solid #1f2430;border-bottom:none;background:#f4f4f6;}

  .cd-footer{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:16px;}
  .cd-remarks{flex:1;}
  .cd-remarks .cd-blank-box{border:1px solid #e3e3e3;border-radius:6px;height:34px;margin-top:4px;}
  .cd-totalbox{background:#1f2430;color:#fff;border-radius:8px;padding:9px 20px;text-align:center;flex:none;min-width:120px;}
  .cd-totalbox span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;opacity:0.75;margin-bottom:3px;}
  .cd-totalbox b{font-size:18px;font-weight:700;}

  .challan-sign{display:flex;justify-content:space-between;gap:10px;margin-top:42px;}
  .challan-sign div{border-top:1px solid #1f2430;padding-top:6px;font-size:10.5px;flex:1;text-align:center;font-weight:600;color:#444;}

  /* Two copies side by side on one page, like a real challan book */
  .challan-page{display:flex;width:277mm;max-width:100%;margin:0 auto;}
  .challan-page .challan-doc{flex:1 1 50%;width:auto;padding:8mm 9mm;font-size:9.5px;margin:0;}
  .challan-page .challan-doc:nth-child(2){border-left:1px dashed #ccc;}
  .challan-page .cd-logo{width:30px;height:30px;font-size:11px;border-radius:7px;}
  .challan-page .cd-company{font-size:13px;}
  .challan-page .cd-address,.challan-page .cd-gst{font-size:9px;}
  .challan-page .cd-doc-meta{padding:7px 12px;min-width:120px;}
  .challan-page .cd-doc-title{font-size:9.5px;}
  .challan-page .cd-doc-row{font-size:9px;gap:10px;}
  .challan-page .cd-label{font-size:8px;}
  .challan-page .cd-value{font-size:9.5px;}
  .challan-page table.challan-table th{font-size:8.5px;padding:5px 5px;}
  .challan-page table.challan-table td{font-size:9px;padding:5px 5px;}
  .challan-page .cd-totalbox{padding:6px 12px;min-width:90px;}
  .challan-page .cd-totalbox b{font-size:14px;}
  .challan-page .challan-sign{margin-top:26px;}
  .challan-page .challan-sign div{font-size:9px;}

  @page{ size: A4 landscape; margin:8mm; }

  /* Order Sheet — size matrix (sizes across top, countries down the side), grouped by File then PO */
  .sheet-doc{width:277mm;max-width:100%;margin:0 auto;padding:8mm;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;}
  .sheet-doc .co-name{font-size:16px;font-weight:900;margin:0;}
  .sheet-doc .co-addr{font-size:11px;margin:2px 0 10px;}
  .sheet-file-title{font-weight:900;font-size:13px;letter-spacing:0.5px;border-top:1px solid #000;border-bottom:1px solid #000;padding:5px 0;margin:14px 0 14px;text-transform:uppercase;}
  /* Each File's title (after the first) starts fresh, and each PO+Color block stays together on
     one page, with every block after the first in that file starting its own new page. */
  .sheet-file-title:not(:first-child){page-break-before:always;break-before:page;}
  .sheet-block{margin-bottom:18px;page-break-inside:avoid;break-inside:avoid;}
  .sheet-block + .sheet-block{page-break-before:always;break-before:page;}
  .sheet-block-head{display:flex;gap:24px;font-size:12px;font-weight:800;margin-bottom:6px;flex-wrap:wrap;}
  table.sheet-table{width:100%;border-collapse:collapse;}
  table.sheet-table th,table.sheet-table td{border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center;}
  table.sheet-table th{font-weight:900;background:#eee;}
  table.sheet-table tr.total-row td{font-weight:900;background:#f5f5f5;}
  table.sheet-table tr.grand-total-row td{font-weight:900;background:#0a0a0a;color:#fff;}
  table.sheet-table tr.date-sep td{

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadAll(){
  try{
    const o = await window.storage.get('orders-data', false);
    ORDERS = o ? JSON.parse(o.value) : [];
  }catch(e){ ORDERS = []; }
  try{
    const c = await window.storage.get('cutting-entries-data', false);
    ENTRIES = c ? JSON.parse(c.value) : [];
  }catch(e){ ENTRIES = []; }
  try{
    const ch = await window.storage.get('challans-data', false);
    CHALLANS = ch ? JSON.parse(ch.value) : [];
  }catch(e){ CHALLANS = []; }
  // One-time, non-destructive history classification: the user confirmed all
  // cutting issues recorded before unit/line tracking belong to Unit C66.
  // Preserve challan rows, dates, quantities, IDs and any known line number.
  let historyUnitUpdated = false;
  CHALLANS = CHALLANS.map(challan => {
    const oldIssuedTo = String(challan.issuedTo || COMPANY.issuedTo || '');
    let nextIssuedTo;
    if (/UNIT-[A-Z0-9_-]+/i.test(oldIssuedTo)) {
      nextIssuedTo = oldIssuedTo.replace(/UNIT-[A-Z0-9_-]+/ig, 'UNIT-C66');
    } else {
      nextIssuedTo = `${oldIssuedTo} - UNIT-C66`.trim();
    }
    if (nextIssuedTo !== String(challan.issuedTo || '')) historyUnitUpdated = true;
    return { ...challan, issuedTo: nextIssuedTo };
  });
  if (historyUnitUpdated) {
    try { await saveChallans(); }
    catch(e) { console.error('Could not save historical Unit C66 classification', e); }
  }
  try{
    const cnt = await window.storage.get('challan-counter-data', false);
    CHALLAN_COUNTER = cnt ? Number(JSON.parse(cnt.value).value) : 0;
  }catch(e){ CHALLAN_COUNTER = 0; }
  try{
    const comp = await window.storage.get('company-settings-data', false);
    if(comp){ COMPANY = Object.assign({}, COMPANY, JSON.parse(comp.value)); }
  }catch(e){ /* keep default COMPANY */ }
  ready = true;
}

// Deleting a challan also removes the cutting entries it created, so order progress stays accurate.
async function deleteChallan(challanId){
  CHALLANS = CHALLANS.filter(ch=>ch.id!==challanId);
  ENTRIES = ENTRIES.filter(e=>e.challanId!==challanId);
  await saveChallans();
  await saveEntries();
}
async function saveCompany(){

async function nextChallanNo(){
  CHALLAN_COUNTER += 1;
  try{ await window.storage.set('challan-counter-data', JSON.stringify({value:CHALLAN_COUNTER}), false); }
  catch(e){ console.error('save counter failed', e); }
  return String(CHALLAN_COUNTER).padStart(4,'0');
}

function getEntryLine(entry){
  const ch = CHALLANS.find(c=>c.id===entry.challanId);
  if(!ch || !ch.issuedTo) return null;
  const m = ch.issuedTo.match(/LINE-(\d+)/);
  return m ? m[1] : null;
}

function getEntryUnit(entry){
  const ch = CHALLANS.find(c=>c.id===entry.challanId);
  if(!ch || !ch.issuedTo) return null;
  const m = ch.issuedTo.match(/UNIT-(\S+?)(?:\s*-|$)/);
  return m ? m[1] : null;
}

function issuedForOrder(orderId, line, unit){
  const map = {};
  ENTRIES.filter(e=>
    e.orderId===orderId &&
    (!line || getEntryLine(e)===line) &&
    (!unit || getEntryUnit(e)===unit)
  ).forEach(e=>{
    e.sizes.forEach(s=>{ map[s.size] = (map[s.size]||0) + Number(s.qty); });
  });
  return map;
}

function orderStatus(order){
  const issued = issuedForOrder(order.id);
  let target=0, done=0;
  order.sizes.forEach(s=>{ target += Number(s.qty); done += Number(issued[s.size]||0); });
  if(done<=0) return {label:'Pending', cls:'status-pending', done, target};
  if(done>=target) return {label:'Complete', cls:'status-done', done, target};
  return {label:'In Progress', cls:'status-progress', done, target};
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtNum(n){ return Number(n||0).toLocaleString('en-IN'); }

// Smoothly animate KPI numbers from 0 up to their target value.
function animateCountUps(scope){
  const els = scope.querySelectorAll('.num[data-count]');
  const duration = 650;
  els.forEach(el=>{
    const target = Number(el.dataset.count)||0;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmtNum(Math.round(target*eased));
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function getFilteredOrdersForDashboard(f){
  return ORDERS.filter(o=>{
    if(f.file && !(o.fileNumber||'').toLowerCase().includes(f.file)) return false;
    if(f.po && !o.po.toLowerCase().includes(f.po)) return false;
    if(f.country && !o.country.toLowerCase().includes(f.country)) return false;
    if(f.status){
      const st = orderStatus(o).label;
      if(f.status==='Pending' && st!=='Pending') return false;
      if(f.status==='In Progress' && st!=='In Progress') return false;
      if(f.status==='Complete' && st!=='Complete') return false;
    }
    if(f.from && o.date < f.from) return false;
    if(f.to && o.date > f.to) return false;
    if(f.search){
      const hay = `${o.fileNumber} ${o.po} ${o.country}`.toLowerCase();
      if(!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function statusBadgeClass(label){
  if(label==='Pending') return 'badge-pending';
  if(label==='In Progress') return 'badge-progress';
  return 'badge-completed';
}

/* ---------- ORDER SHEET — shared size-matrix builder (sizes across top, countries down, grouped by File then PO, then Cutting Date) ---------- */
function groupOrdersByFile(orders){
  const fileOrder = [];
  const byFile = {};
  orders.forEach(o=>{
    const key = o.fileNumber || '(No File Number)';
    if(!byFile[key]){ byFile[key]=[]; fileOrder.push(key); }
    byFile[key].push(o);
  });
  return {fileOrder, byFile};
}

function buildFileBlockHtml(fileNumber, ordersForFile){
  // group by PO, preserving entry sequence
  const poOrder = [];
  const byPo = {};
  ordersForFile.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>{
    if(!byPo[o.po]){ byPo[o.po]=[]; poOrder.push(o.po); }
    byPo[o.po].push(o);
  });

  const poBlocks = poOrder.map(po=>{
    // split this PO's orders by Color — each color becomes its own sheet/page
    const { colorOrder, byColor } = groupByColor(byPo[po]);
    return colorOrder.map(color=>{
      const orders = byColor[color];
      const sizeSet = [];
      orders.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
      sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));

      // group countries by Cutting Date — same date = one section together
      const dateOrder = [];
      const byDate = {};
      orders.forEach(o=>{
        if(!byDate[o.date]){ byDate[o.date]=[]; dateOrder.push(o.date); }
        byDate[o.date].push(o);
      });
      dateOrder.sort();

      const grandColTotals = {}; sizeSet.forEach(s=>grandColTotals[s]=0);
      let grand = 0;

      const dateSectionsHtml = dateOrder.map(date=>{
        const dateOrders = byDate[date];
        const colTotals = {}; sizeSet.forEach(s=>colTotals[s]=0);
        let dateTotal = 0;
        const rows = dateOrders.map(o=>{
          const bySize={}; o.sizes.forEach(s=>bySize[s.size]=Number(s.qty));
          let rowTotal=0;
          const cells = sizeSet.map(sz=>{
            const q = bySize[sz]||0; rowTotal+=q; colTotals[sz]+=q; grandColTotals[sz]+=q;
            return `<td>${q>0?q:'-'}</td>`;
          }).join('');
          dateTotal += rowTotal;
          const isMii = o.origin==='MADE IN INDIA';
          const originTag = isMii ? ' (MADE IN INDIA)' : '';
          return `<tr class="${isMii?'mii-row':''}"><td style="text-align:left;font-weight:800;">${escapeHtml(o.country)}${escapeHtml(originTag)}</td>${cells}<td><b>${rowTotal}</b></td></tr>`;
        }).join('');
        grand += dateTotal;
        const subtotalCells = sizeSet.map(sz=>`<td>${colTotals[sz]}</td>`).join('');
        return `
          <tr class="date-sep"><td colspan="${sizeSet.length+2}">Cutting Date: ${escapeHtml(date)}</td></tr>
          ${rows}
          <tr class="total-row"><td>TOTAL</td>${subtotalCells}<td>${dateTotal}</td></tr>
        `;
      }).join('');

      const grandCells = sizeSet.map(sz=>`<td>${grandColTotals[sz]}</td>`).join('');
      return `
        <div class="sheet-block">
          <div class="sheet-block-head">
            <span>PO: ${escapeHtml(po)}</span>
            <span>Color: ${escapeHtml(color||'-')}</span>
            <span>Total Qty: ${grand}</span>
          </div>
          <table class="sheet-table">
            <tr><th>Country</th>${sizeSet.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('')}<th>Total</th></tr>
            ${dateSectionsHtml}
            <tr class="grand-total-row"><td>GRAND TOTAL</td>${grandCells}<td>${grand}</td></tr>
          </table>
        </div>
      `;
    }).join('');
  }).join('');

  return `<div class="sheet-file-title">FILE NO - ${escapeHtml(fileNumber)}</div>${poBlocks}`;
}

function buildOrderSheetHtml(orders){
  if(orders.length===0) return '';
  const {fileOrder, byFile} = groupOrdersByFile(orders);
  const sections = fileOrder.map(fn=>buildFileBlockHtml(fn, byFile[fn])).join('');
  const today = new Date().toISOString().slice(0,10);
  const metaRows = `<div class="cd-doc-row"><span>Generated</span><b>${today}</b></div>`;
  return `
    <div class="sheet-doc">
      ${buildLetterheadHtml('Order Sheet', metaRows)}
      ${sections}
    </div>
  `;
}

/* ---------- TAB: CUTTING ISSUE ENTRY ---------- */
// Given a fileNumber (and optional origin filter), sorted list of orders (POs) in that file, earliest cutting date first.
function ordersInFile(fileNumber, origin){
  return ORDERS.filter(o=> o.fileNumber===fileNumber && (!origin || (o.origin||'COMMON')===origin))
    .sort((a,b)=> a.date.localeCompare(b.date) || a.createdAt-b.createdAt);
}

// Allocate an entered qty (per size) across the file's POs matching the given Origin, earliest cutting date first.
function allocateForFile(fileNumber, sizeQtyMap, origin){
  const list = ordersInFile(fileNumber, origin);
  const result = [];
  for(const size in sizeQtyMap){
    let remaining = Number(sizeQtyMap[size]);
    if(!(remaining>0)) continue;
    const allocations = [];
    for(const order of list){
      if(remaining<=0) break;
      const sizeEntry = order.sizes.find(s=>String(s.size)===String(size));
      if(!sizeEntry) continue;
      const issued = issuedForOrder(order.id)[size] || 0;
      const need = sizeEntry.qty - issued;
      if(need<=0) continue;
      const give = Math.min(need, remaining);
      allocations.push({orderId:order.id, po:order.po, country:order.country, date:order.date, qty:give});
      remaining -= give;
    }
    result.push({size, allocations, unallocated: remaining});
  }
  return result;
}

function renderCut(){
  const c = document.getElementById('content');
  if(ORDERS.length===0){
    c.innerHTML = `<h2 class="section-title">Cutting Issue Entry</h2><div class="empty">Please add a File / PO / Country entry first from the "Add Order" tab.</div>`;
    return;
  }

  let pendingChallanNo = null; // reserved via "New", consumed by the next save

  c.innerHTML = `

    <div class="challan-topbar">
      <div>
        <label style="margin:0 0 4px;">Challan No</label>

      </div>

  function renderCreateMode(){

    const fileNumbers = [...new Set(ORDERS.map(o=>o.fileNumber).filter(Boolean))].sort();
    bodyBox.innerHTML = `
      <label>File Number</label>
      <input type="text" id="cf-file" placeholder="Enter file number" list="cf-file-list">
      <datalist id="cf-file-list">${fileNumbers.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
      <div id="cf-form"></div>
    `;
    const formBox = document.getElementById('cf-form');

    function renderDynamic(fileNumber, origin, dynamicBox){
      const list = ordersInFile(fileNumber, origin);
      if(list.length===0){
        dynamicBox.innerHTML = '<div class="empty">No orders found in this File Number for the selected Origin.</div>';
        return;
      }
      const sizeSet = [];
      list.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
      const today = new Date().toISOString().slice(0,10);
      const rows = sizeSet.map(sz=>`
        <div class="size-box">
          <span class="cf-label">${escapeHtml(String(sz))}</span>
          <input type="number" class="cf-qty-input" data-size="${escapeHtml(String(sz))}" placeholder="Pcs" min="0">
        </div>
      `).join('');
      const lineOptions = Array.from({length:10}, (_,i)=>i+1).map(n=>`<option value="${n}">Line ${n}</option>`).join('');
      const unitOptions = UNITS.map(u=>`<option value="${u}" ${u==='C66'?'selected':''}>${u}</option>`).join('');
      dynamicBox.innerHTML = `
        <label>Cutting Issue Date</label>
        <input type="date" id="cf-date" value="${today}">
        <div class="row">
          <div>
            <label>Unit</label>
            <select id="cf-unit">${unitOptions}</select>
          </div>
          <div>
            <label>Production Line</label>
            <select id="cf-line">${lineOptions}</select>
          </div>
        </div>
        <label>Size-wise Quantity (Cut Today)</label>
        <div class="size-box-wrap">${rows}</div>
        <button type="button" class="btn-primary" id="cf-save-btn">Save Cutting Issue — Auto-match PO/Country</button>
        <div class="msg" id="cf-msg"></div>
        <div id="cf-result"></div>
      `;
      document.getElementById('cf-save-btn').onclick = async ()=>{
        const date = document.getElementById('cf-date').value;
        const unit = document.getElementById('cf-unit').value;
        const lineNo = document.getElementById('cf-line').value;
        const issuedTo = `${COMPANY.issuedTo} - UNIT-${unit} - LINE-${lineNo}`;
        const msg = document.getElementById('cf-msg');
        const resultBox = document.getElementById('cf-result');
        if(!date){ msg.textContent='Please enter a date.'; msg.className='msg err show'; resultBox.innerHTML=''; return; }
        const sizeQtyMap = {};
        dynamicBox.querySelectorAll('.cf-qty-input').forEach(inp=>{
          const v = inp.value.trim();
          if(v!=='' && Number(v)>0){ sizeQtyMap[inp.dataset.size] = Number(v); }
        });
        if(Object.keys(sizeQtyMap).length===0){ msg.textContent='Please enter quantity for at least one size.'; msg.className='msg err show'; resultBox.innerHTML=''; return; }

        const allocationResult = allocateForFile(fileNumber, sizeQtyMap, origin);

        // group allocations by orderId to create cutting entries
        const byOrder = {};
        allocationResult.forEach(r=>{
          r.allocations.forEach(a=>{
            if(!byOrder[a.orderId]) byOrder[a.orderId] = [];
            byOrder[a.orderId].push({size:r.size, qty:a.qty});
          });
        });
        const createdEntriesByOrder = {};
        Object.keys(byOrder).forEach(orderId=>{
          const entry = {id:uid(), orderId, date, sizes:byOrder[orderId], createdAt:Date.now(), challanId:null};
          ENTRIES.push(entry);
          createdEntriesByOrder[orderId] = entry;
        });
        await saveEntries();

        // group by PO NUMBER (not by order) — one challan per PO, all its countries combined as rows
        const byPo = {};
        Object.keys(byOrder).forEach(orderId=>{
          const order = ORDERS.find(o=>o.id===orderId);
          if(!order) return;
          if(!byPo[order.po]) byPo[order.po] = [];
          byOrder[orderId].forEach(s=>{
            byPo[order.po].push({country:order.country, origin:order.origin||'COMMON', size:s.size, qty:s.qty, color:order.color||''});
          });
        });

        const newChallans = [];
        for(const po of Object.keys(byPo)){
          // the challan number reserved via "New" is used for the first challan of this save; extra POs get fresh numbers
          const challanNo = pendingChallanNo || await nextChallanNo();
          pendingChallanNo = null;
          const challan = {
            id: uid(),
            challanNo,
            date,
            issuedTo,
            fileNumber,
            po,
            rows: byPo[po].slice(),
            createdAt: Date.now()
          };
          CHALLANS.push(challan);
          newChallans.push(challan);
          // tag the entries created for orders under this PO with this challan's id, so edits can re-sync them
          Object.keys(byOrder).forEach(orderId=>{
            const order = ORDERS.find(o=>o.id===orderId);
            if(order && order.po===po && createdEntriesByOrder[orderId]){
              createdEntriesByOrder[orderId].challanId = challan.id;
            }
          });
        }
        await saveChallans();
        await saveEntries();
        challanDisplay.textContent = 'Will be assigned on save';

        // build result summary
        const summaryHtml = allocationResult.map(r=>{
          const allocLines = r.allocations.map(a=>
            `<div>→ <b>${a.qty} pcs</b> allocated to PO <b>${escapeHtml(a.po)}</b> / <b>${escapeHtml(a.country)}</b> (cutting date ${a.date})</div>`
          ).join('');
          return `

          };
        });

        msg.textContent = 'Cutting issue saved and challan generated.';
        msg.className='msg show';

        dynamicBox.querySelectorAll('.cf-qty-input').forEach(inp=> inp.value='');
      };
    }

    function showForm(fileNumber){
      formBox.innerHTML = `
        <label>Origin</label>
        <select id="cf-origin">
          <option value="COMMON">Common</option>
          <option value="MADE IN INDIA">Made In India</option>
        </select>

      `;

      const originSelect = document.getElementById('cf-origin');
      renderDynamic(fileNumber, originSelect.value, dynamicBox);
      originSelect.onchange = ()=> renderDynamic(fileNumber, originSelect.value, dynamicBox);
    }

    const fileInput = document.getElementById('cf-file');
    fileInput.oninput = ()=>{

      if(list.length===0){
        formBox.innerHTML = '<div class="empty">No PO/Order found under this File Number.</div>';
        return;

    };

  function renderEditMode(challan){
    challanDisplay.textContent = challan.challanNo + ' (editing)';
    const sizeSet = [];
    challan.rows.forEach(r=>{ if(!sizeSet.includes(r.size)) sizeSet.push(r.size); });
    sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));
    const byCountry = {}; const countryOrder = [];
    challan.rows.forEach(r=>{
      if(!byCountry[r.country]){ byCountry[r.country]=[]; countryOrder.push(r.country); }
      byCountry[r.country].push(r);
    });

    const rowsHtml = countryOrder.map(country=>{
      const list = byCountry[country];
      const bySize = {}; list.forEach(r=>bySize[r.size]=r.qty);
      const boxes = sizeSet.map(sz=>`
        <div class="size-box">
          <span class="cf-label">${escapeHtml(String(sz))}</span>
          <input type="number" class="edit-qty-input" data-country="${escapeHtml(country)}" data-size="${escapeHtml(String(sz))}" value="${bySize[sz]!==undefined ? bySize[sz] : ''}" min="0">
        </div>
      `).join('');
      const originLabel = list[0].origin==='MADE IN INDIA' ? ' — Made In India' : '';
      return `<div style="margin-bottom:14px;"><label>${escapeHtml(country)}${originLabel}</label><div class="size-box-wrap">${boxes}</div></div>`;
    }).join('');

    bodyBox.innerHTML = `
      <div class="challan-card" style="cursor:default;">
        <div>
          <div class="cno">File ${escapeHtml(challan.fileNumber)} — PO ${escapeHtml(challan.po)}</div>
          <div class="cmeta">Date: ${challan.date} — Issued To: ${escapeHtml(challan.issuedTo||'')}</div>
        </div>
        <button type="button" class="print-btn" id="cf-edit-print-btn">Print</button>
      </div>
      <label>Edit Size-wise Quantity</label>
      ${rowsHtml}
      <button type="button" class="btn-primary" id="cf-edit-save-btn">Save Changes</button>
      <button type="button" class="add-size-btn" id="cf-edit-cancel-btn" style="width:100%;margin-top:8px;">Cancel — Back to New Entry</button>
      <div class="msg" id="cf-edit-msg"></div>
    `;

    document.getElementById('cf-edit-print-btn').onclick = ()=> openPrintChallan(challan);
    document.getElementById('cf-edit-cancel-btn').onclick = ()=>{ challanDisplay.textContent = pendingChallanNo ? (pendingChallanNo+' (new — not yet saved)') : 'Will be assigned on save'; renderCreateMode(); };

    document.getElementById('cf-edit-save-btn').onclick = async ()=>{
      const newRows = [];
      bodyBox.querySelectorAll('.edit-qty-input').forEach(inp=>{
        const v = inp.value.trim();
        const qty = Number(v);
        if(v!=='' && qty>0){
          const country = inp.dataset.country;
          const meta = byCountry[country][0];
          newRows.push({country, origin:meta.origin, size:inp.dataset.size, qty, color:meta.color});
        }
      });
      challan.rows = newRows;
      await saveChallans();

      // re-sync the cutting entries tied to this challan so remaining-quantity tracking stays accurate
      ENTRIES = ENTRIES.filter(e=> e.challanId !== challan.id);
      const grouped = {};
      newRows.forEach(r=>{
        const order = ORDERS.find(o=> o.fileNumber===challan.fileNumber && o.po===challan.po && o.country===r.country);
        if(!order) return;
        if(!grouped[order.id]) grouped[order.id]=[];
        grouped[order.id].push({size:r.size, qty:r.qty});
      });
      Object.keys(grouped).forEach(orderId=>{
        ENTRIES.push({id:uid(), orderId, date:challan.date, sizes:grouped[orderId], createdAt:Date.now(), challanId:challan.id});
      });
      await saveEntries();

      const msg = document.getElementById('cf-edit-msg');
      msg.textContent = 'Challan updated.';
      msg.className = 'msg show';
    };
  }

  document.getElementById('cf-new-btn').onclick = async ()=>{
    pendingChallanNo = await nextChallanNo();
    renderCreateMode();
  };

  document.getElementById('cf-edit-search').addEventListener('change', (e)=>{
    const val = e.target.value.trim();
    const ch = CHALLANS.find(x=>x.challanNo===val);
    if(ch) renderEditMode(ch);
  });

  renderCreateMode();
}

/* ---------- TAB: ISSUED CUTTING (actual quantities cut so far, by File → PO → Color → Origin) ---------- */
// Split a PO's orders into one group per Color — each group becomes its own printed "sheet".
function groupByColor(orders){
  const colorOrder = []; const byColor = {};
  orders.forEach(o=>{
    const key = o.color || '';
    if(!byColor[key]){ byColor[key]=[]; colorOrder.push(key); }
    byColor[key].push(o);
  });
  return {colorOrder, byColor};
}

function buildIssuedCuttingHtml(fileNumber, line, unit){
  const list = ORDERS.filter(o=>o.fileNumber===fileNumber);
  if(list.length===0) return '';

  const poOrder = [];
  const byPo = {};
  list.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>{
    if(!byPo[o.po]){ byPo[o.po]=[]; poOrder.push(o.po); }
    byPo[o.po].push(o);
  });

  const poBlocks = poOrder.map(po=>{
    const { colorOrder, byColor } = groupByColor(byPo[po]);
    return colorOrder.map(color=>{
      const orders = byColor[color];
      const sizeSet = [];
      orders.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
      sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));

      const commonTotals = {}; const miiTotals = {};
      sizeSet.forEach(s=>{ commonTotals[s]=0; miiTotals[s]=0; });
      orders.forEach(o=>{
        const issued = issuedForOrder(o.id, line, unit);
        const bucket = (o.origin==='MADE IN INDIA') ? miiTotals : commonTotals;
        sizeSet.forEach(s=>{ bucket[s] += Number(issued[s]||0); });
      });

      const commonRowTotal = sizeSet.reduce((s,sz)=>s+commonTotals[sz],0);
      const miiRowTotal = sizeSet.reduce((s,sz)=>s+miiTotals[sz],0);
      const grand = commonRowTotal + miiRowTotal;

      const sizeHeadHtml = sizeSet.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('');
      const commonCells = sizeSet.map(sz=>`<td>${commonTotals[sz]}</td>`).join('');
      const miiCells = sizeSet.map(sz=>`<td>${miiTotals[sz]}</td>`).join('');
      const totalCells = sizeSet.map(sz=>`<td>${commonTotals[sz]+miiTotals[sz]}</td>`).join('');

      return `
        <div class="issued-po-block">
          <div class="issued-po-title">(${escapeHtml(po)})${color? ' — '+escapeHtml(color) : ''}</div>
          <table class="issued-table">
            <tr><th>&nbsp;</th>${sizeHeadHtml}<th>Total</th></tr>
            <tr class="row-common"><td>Common</td>${commonCells}<td><b>${commonRowTotal}</b></td></tr>
            <tr class="row-mii"><td>Made In India</td>${miiCells}<td><b>${miiRowTotal}</b></td></tr>
            <tr class="row-total"><td>Total Cutting</td>${totalCells}<td>${grand}</td></tr>
          </table>
        </div>
      `;
    }).join('');
  }).join('');

  const today = new Date().toISOString().slice(0,10);
  const metaRows = `
    <div class="cd-doc-row"><span>Generated</span><b>${today}</b></div>
    ${unit ? `<div class="cd-doc-row"><span>Unit</span><b>${escapeHtml(unit)}</b></div>` : ''}
    ${line ? `<div class="cd-doc-row"><span>Line</span><b>LINE-${escapeHtml(line)}</b></div>` : ''}
  `;
  const filterSuffix = [unit?('Unit '+unit):null, line?('Line '+line):null].filter(Boolean).join(' — ');
  return `
    <div class="issued-doc">
      ${buildLetterheadHtml('Issued Cutting Report', metaRows)}
      <div class="issued-file-title">File Number: ${escapeHtml(fileNumber)}${filterSuffix? ' — '+escapeHtml(filterSuffix) : ''}</div>
      ${poBlocks}
    </div>
  `;
}

  const unitOptions = UNITS.map(u=>`<option value="${u}">${u}</option>`).join('');

function companyInitials(name){
  const words = String(name||'').replace(/PVT\.?|LTD\.?|LIMITED|PRIVATE/gi,'').trim().split(/\s+/).filter(Boolean);
  return (words.slice(0,2).map(w=>w[0]).join('')).toUpperCase() || 'CO';
}

function buildLetterheadHtml(docTitle, metaRowsHtml){
  return `
    <div class="cd-header">
      <div class="cd-brand">
        <div class="cd-logo">${escapeHtml(companyInitials(COMPANY.name))}</div>
        <div>
          <p class="cd-company">${escapeHtml(COMPANY.name)}</p>
          <p class="cd-address">${escapeHtml(COMPANY.addr)}</p>
          <p class="cd-gst">GSTIN: ${escapeHtml(COMPANY.gst)}</p>
        </div>
      </div>
      <div class="cd-doc-meta">
        <div class="cd-doc-title">${escapeHtml(docTitle)}</div>
        ${metaRowsHtml}
      </div>
    </div>
  `;
}

function buildChallanHtml(challan){
  // Pivot: sizes become columns, one row per country (horizontal size breakup)
  const sizeOrder = [];
  challan.rows.forEach(r=>{ if(!sizeOrder.includes(r.size)) sizeOrder.push(r.size); });
  sizeOrder.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));

  const byCountry = {};
  const countryOrder = [];
  challan.rows.forEach(r=>{
    if(!byCountry[r.country]){ byCountry[r.country]=[]; countryOrder.push(r.country); byCountry[r.country]._color = r.color||''; byCountry[r.country]._origin = r.origin||'COMMON'; }
    byCountry[r.country].push(r);
  });

  const sizeHeadHtml = sizeOrder.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('');
  const colTotals = {}; sizeOrder.forEach(sz=> colTotals[sz]=0);
  let grandTotal = 0;

  const bodyRowsHtml = countryOrder.map((country,i)=>{
    const list = byCountry[country];
    const bySize = {}; list.forEach(r=> bySize[r.size]=Number(r.qty));
    let rowTotal = 0;
    const sizeCellsHtml = sizeOrder.map(sz=>{
      const q = bySize[sz]||0;
      rowTotal += q; colTotals[sz]+=q;
      return `<td>${q>0?q:'-'}</td>`;
    }).join('');
    grandTotal += rowTotal;
    const originSuffix = list._origin === 'MADE IN INDIA' ? ' - MADE IN INDIA' : '';
    return `
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(challan.fileNumber)}</td>
        <td class="desc">CUTTING - ISSUE - (${escapeHtml(country)} - ${escapeHtml(challan.po)})${originSuffix}</td>
        <td></td>
        ${sizeCellsHtml}
        <td><b>${rowTotal}</b></td>
        <td>PCS</td>
        <td>${escapeHtml(list._color||'')}</td>
      </tr>
    `;
  }).join('');

  const totalRowCells = sizeOrder.map(sz=>`<td>${colTotals[sz]}</td>`).join('');

  const metaRows = `
    <div class="cd-doc-row"><span>Challan No.</span><b>${escapeHtml(challan.challanNo)}</b></div>
    <div class="cd-doc-row"><span>Date</span><b>${challan.date}</b></div>
  `;

  return `
    <div class="challan-doc">
      ${buildLetterheadHtml('Inhouse / Inter Unit Transfer Challan', metaRows)}

      <div class="cd-parties">
        <div>
          <div class="cd-label">Issued From</div>
          <div class="cd-value">Cutting Department</div>
        </div>
        <div>
          <div class="cd-label">Issued To</div>
          <div class="cd-value">${escapeHtml(challan.issuedTo||'-')}</div>
        </div>
        <div>
          <div class="cd-label">Vehicle No. / Driver / E-Way No.</div>
          <div class="cd-value cd-blank">&nbsp;</div>
        </div>
      </div>

      <table class="challan-table">
        <thead>
        <tr>
          <th>SL.<br>NO</th><th>FILE<br>NO</th><th>Item Description</th><th>HSN</th>${sizeHeadHtml}<th>Total</th><th>Unit</th><th>Color</th>
        </tr>
        </thead>
        <tbody>
        ${bodyRowsHtml}
        </tbody>
        <tfoot>
        <tr class="total-row">
          <td colspan="4">Total</td>
          ${totalRowCells}
          <td>${grandTotal}</td>
          <td colspan="2"></td>
        </tr>
        </tfoot>
      </table>

      <div class="cd-footer">
        <div class="cd-remarks">
          <div class="cd-label">Remarks</div>
          <div class="cd-blank-box"></div>
        </div>
        <div class="cd-totalbox">
          <span>Total Pieces</span>
          <b>${grandTotal}</b>
        </div>
      </div>

      <div class="challan-sign">
        <div>Prepared By</div>
        <div>Received By</div>
        <div>Authorized By</div>
      </div>
    </div>
  `;
}

          <input type="checkbox" class="u-access-cb" value="${t.id}" style="width:15px;height:15px;">
          ${escapeHtml(t.label)}
        </label>
      `).join('')}
    </div>
    <button type="button" class="btn-primary" id="u-save-btn">Save User</button>
    <button type="button" class="add-size-btn" id="u-cancel-btn" style="width:100%;margin-top:10px;display:none;">Cancel Edit — Add New User Instead</button>
    <div class="msg" id="u-msg"></div>
  `;

  function resetForm(){
    document.getElementById('u-editing-username').value = '';
    document.getElementById('u-username').value = '';
    document.getElementById('u-username').disabled = false;
    document.getElementById('u-password').value = '';
    document.querySelectorAll('.u-access-cb').forEach(cb=> cb.checked=false);
    document.getElementById('u-cancel-btn').style.display = 'none';
    document.getElementById('u-save-btn').textContent = 'Save User';
  }

  function drawList(){
    const listBox = document.getElementById('users-list');
    const usernames = Object.keys(USERS).sort((a,b)=> a==='admin' ? -1 : b==='admin' ? 1 : a.localeCompare(b));
    listBox.innerHTML = usernames.map(uname=>{
      const u = USERS[uname];
      if(u.isAdmin){
        return `
          <div class="challan-card">
            <div>
              <div class="cno">${escapeHtml(uname)}</div>
              <div class="cmeta">Full access — Admin account</div>
            </div>
          </div>
        `;
      }
      const accessLabels = u.allowedTabs.map(t=> (ASSIGNABLE_TABS.find(x=>x.id===t)||{label:t}).label).join(', ');
      return `
        <div class="challan-card">
          <div>
            <div class="cno">${escapeHtml(uname)}</div>
            <div class="cmeta">Access: ${escapeHtml(accessLabels || 'None yet')}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button type="button" class="print-btn" data-edit="${escapeHtml(uname)}">Edit</button>
            <button type="button" class="print-btn" style="background:var(--red);border-color:var(--red);" data-delete="${escapeHtml(uname)}">Delete</button>
          </div>
        </div>
      `;
    }).join('');

    listBox.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const uname = btn.dataset.edit;
        const u = USERS[uname];
        document.getElementById('u-editing-username').value = uname;
        document.getElementById('u-username').value = uname;
        document.getElementById('u-username').disabled = true;
        document.getElementById('u-password').value = u.password;
        document.querySelectorAll('.u-access-cb').forEach(cb=> cb.checked = u.allowedTabs.includes(cb.value));
        document.getElementById('u-cancel-btn').style.display = 'block';
        document.getElementById('u-save-btn').textContent = 'Update User';
        document.getElementById('u-msg').classList.remove('show');
      };
    });
    listBox.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.onclick = async ()=>{
        const uname = btn.dataset.delete;
        const ok = confirm(`Delete user "${uname}"? They will no longer be able to sign in.`);
        if(!ok) return;
        delete USERS[uname];
        await saveUsers();
        resetForm();
        drawList();
      };
    });
  }

  drawList();

  document.getElementById('u-cancel-btn').onclick = resetForm;

  document.getElementById('u-save-btn').onclick = async ()=>{
    const editingUsername = document.getElementById('u-editing-username').value;
    const username = document.getElementById('u-username').value.trim();
    const password = document.getElementById('u-password').value.trim();
    const allowedTabs = [...document.querySelectorAll('.u-access-cb:checked')].map(cb=>cb.value);
    const msg = document.getElementById('u-msg');

    if(!username || !password){
      msg.textContent = 'Username and password are required.'; msg.className = 'msg err show'; return;
    }
    if(!editingUsername && USERS[username]){
      msg.textContent = 'That username already exists.'; msg.className = 'msg err show'; return;
    }
    if(allowedTabs.length===0){
      msg.textContent = 'Select at least one section this user can access.'; msg.className = 'msg err show'; return;
    }
    USERS[username] = { password, name: username.charAt(0).toUpperCase()+username.slice(1), isAdmin:false, allowedTabs };
    await saveUsers();
    msg.textContent = 'User saved.'; msg.className = 'msg show';
    resetForm();
    drawList();
  };
}

const renderers = { dashboard: renderDashboard, new: renderNew, list: renderList, cut: renderCut, issued: renderIssuedCutting, date: renderDate, challans: renderChallans, users: renderUsers, settings: renderSettings };

const PAGE_META = {
  dashboard: ['Dashboard', 'Overview of your cutting operations'],
  new: ['Add Order', 'Create a new File / PO / Country entry'],
  list: ['Order Sheet', 'Size-wise breakdown grouped by File and PO'],
  cut: ['Cutting Issue', 'Record cutting issue and manage challans'],
  issued: ['Issued Cutting', 'Actual quantities cut, by File and PO'],
  date: ['Daily Schedule', 'Cutting scheduled across countries by date'],
  challans: ['Challans', 'All generated inhouse transfer challans'],
  users: ['Users & Access', 'Create accounts and choose what each person can open'],
  settings: ['Settings', 'Company details and preferences']
};

function setHeader(name){
  const meta = PAGE_META[name] || ['Cutting Tracker', ''];
  const titleEl = document.getElementById('page-title');
  const subEl = document.getElementById('page-subtitle');
  if(titleEl) titleEl.textContent = meta[0];
  if(subEl) subEl.textContent = meta[1];
}

function playContentFade(){
  const el = document.getElementById('content');
  el.classList.remove('fade-in');
  void el.offsetWidth; // force reflow so the animation restarts
  el.classList.add('fade-in');
}

function switchTab(name){
  if(CURRENT_USER && !CURRENT_USER.allowedTabs.includes(name)) return; // not permitted for this account
  document.querySelectorAll('.nav-item[data-tab]').forEach(t=> t.classList.toggle('active', t.dataset.tab===name));
  setHeader(name);
  renderers[name]();
  playContentFade();
}

function bindTabs(){
  document.querySelectorAll('.nav-item[data-tab]').forEach(tab=>{
    tab.onclick = ()=> switchTab(tab.dataset.tab);
  });
}

/* ---------- Login / access control ---------- */
function applyRoleVisibility(){
  if(!CURRENT_USER) return;
  document.querySelectorAll('.nav-item[data-tab]').forEach(item=>{
    item.style.display = CURRENT_USER.allowedTabs.includes(item.dataset.tab) ? '' : 'none';
  });
  const avatar = document.getElementById('user-avatar');
  if(avatar) avatar.textContent = CURRENT_USER.name.slice(0,2).toUpperCase();
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  applyRoleVisibility();
}
/* ---------- Login UI ----------
   authenticateUser() is the single place that talks to the auth service (currently Supabase).
   To connect a different backend, replace the body of that function; the rest of the form is service-agnostic. */
const LOGIN_ID_KEY = 'ht-login-id';   // remembered employee ID / email only — never the password
const LOGIN_ALIASES = { inadeemx:'inadeemx@gmail.com', cutting:'nadeemansaries@gmail.com' };  // short usernames kept from the original login
let loginBusy = false;
const $login = (id) => document.getElementById(id);

async function authenticateUser(identifier, password){
  const email = LOGIN_ALIASES[identifier.toLowerCase()] || identifier;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return { user: data.user, email };
}

function buildCurrentUser(authUser, email){
  const role = (authUser.app_metadata && authUser.app_metadata.role) || (email.toLowerCase()==='nadeemansaries@gmail.com' ? 'cutting' : 'admin');
  return role === 'cutting'
    ? { username:'cutting', name:'Cutting', isAdmin:false, allowedTabs:['cut','issued','list'] }
    : { username:'inadeemx', name:'Admin', isAdmin:true, allowedTabs:['dashboard','new','list','cut','issued','date','challans','settings','users'] };
}

function friendlyAuthError(e){
  const m = ((e && e.message) || '').toLowerCase();
  if(m.includes('invalid login') || m.includes('invalid credentials')) return 'Incorrect ID/email or password. Check both and try again.';
  if(m.includes('not confirmed')) return 'This account isn’t verified yet. Contact your administrator.';
  if((e && e.status === 429) || m.includes('rate limit')) return 'Too many attempts. Wait a minute, then try again.';
  if(m.includes('fetch') || m.includes('network')) return 'Can’t reach the server. Check your connection and try again.';
  return 'Sign-in failed. Try again, or contact your administrator if it keeps happening.';
}

function setFieldError(input, text){
  const err = $login(input.id + '-error');
  err.textContent = text || '';
  err.hidden = !text;
  if(text) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
}

function setLoginMessage(text, type){
  const box = $login('login-msg');
  if(!text){ box.hidden = true; box.textContent = ''; box.className = 'lg-alert'; return; }
  box.className = 'lg-alert lg-alert--' + (type || 'error');
  box.textContent = text;
  box.hidden = false;
}

function setLoginLoading(on){
  loginBusy = on;
  const btn = $login('login-submit-btn');
  btn.classList.toggle('is-loading', on);
  btn.setAttribute('aria-busy', on ? 'true' : 'false');
  $login('login-btn-label').textContent = on ? 'Signing in…' : 'Sign In';
  $login('login-username').readOnly = on;
  $login('login-password').readOnly = on;
}

function syncPasswordToggle(show){
  const t = $login('login-toggle-pw');
  t.classList.toggle('is-visible', show);
  t.setAttribute('aria-pressed', show ? 'true' : 'false');
  t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function validateLogin(){
  const idEl = $login('login-username'), pwEl = $login('login-password');
  const id = idEl.value.trim();
  let idErr = '';
  if(!id) idErr = 'Enter your employee ID or email.';
  else if(id.indexOf('@') > -1 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)) idErr = 'Enter a valid email address, like name@company.com.';
  else if(/\s/.test(id)) idErr = 'Employee ID can’t contain spaces.';
  const pwErr = pwEl.value ? '' : 'Enter your password.';
  setFieldError(idEl, idErr);
  setFieldError(pwEl, pwErr);
  const firstBad = idErr ? idEl : (pwErr ? pwEl : null);
  if(firstBad) firstBad.focus();
  return !firstBad;
}

function rememberLoginId(remember, id){
  try { if(remember) localStorage.setItem(LOGIN_ID_KEY, id); else localStorage.removeItem(LOGIN_ID_KEY); } catch(e){}
}

async function doLogin(e){
  if(e) e.preventDefault();
  if(loginBusy) return;
  setLoginMessage('');
  if(!validateLogin()) return;
  const identifier = $login('login-username').value.trim();
  const password = $login('login-password').value;
  const remember = $login('login-remember').checked;
  authStorage.persist = remember;
  setLoginLoading(true);
  let auth;
  try {
    auth = await authenticateUser(identifier, password);
  } catch(err) {
    console.error('Sign-in failed', err);
    setLoginMessage(friendlyAuthError(err), 'error');
    setLoginLoading(false);
    const pw = $login('login-password');
    pw.focus(); pw.select();
    return;
  }
  try {
    CURRENT_USER = buildCurrentUser(auth.user, auth.email);
    rememberLoginId(remember, identifier);
    $login('login-password').value = '';
    showApp();
    await bootApp();
  } catch(err) {
    console.error('Workspace failed to load', err);
    showLogin();
    setLoginMessage('You’re signed in, but the workspace didn’t load. Check your connection and try again.', 'error');
  } finally {
    setLoginLoading(false);
  }
}

function showLogin(){
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const idEl = $login('login-username'), pwEl = $login('login-password');
  pwEl.value = ''; pwEl.type = 'password'; syncPasswordToggle(false);
  setFieldError(idEl, ''); setFieldError(pwEl, '');
  setLoginMessage('');
  setLoginLoading(false);
  let saved = null;
  try { saved = localStorage.getItem(LOGIN_ID_KEY); } catch(e){}
  if(!idEl.value && saved) idEl.value = saved;
  // Autofocus only where it won't pop a mobile keyboard.
  if(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    (idEl.value ? pwEl : idEl).focus();
  }
}

async function bootApp(){
  await loadUsers();
  const theme = await loadTheme();
  applyTheme(theme);
  await loadAll();
  // Production mode: do not automatically create sample orders. Keep existing Supabase data intact.
  const landingTab = CURRENT_USER.allowedTabs.includes('dashboard') ? 'dashboard' : CURRENT_USER.allowedTabs[0];
  setHeader(landingTab);
  renderers[landingTab]();
  playContentFade();
}

async function doLogout(){
  try { await sb.auth.signOut(); } catch(e) { console.warn('Sign out:', e); }
  CURRENT_USER = null;
  document.getElementById('login-username').value = '';
  showLogin();
}

function bindLogin(){
  $login('login-form').addEventListener('submit', doLogin);
  ['login-username','login-password'].forEach(function(id){
    $login(id).addEventListener('input', function(){
      setFieldError($login(id), '');
      if(!$login('login-msg').hidden) setLoginMessage('');
    });
  });
  const toggle = $login('login-toggle-pw');
  toggle.addEventListener('mousedown', function(e){ e.preventDefault(); });   // keep focus in the field on click/tap
  toggle.addEventListener('click', function(){
    const pw = $login('login-password');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    syncPasswordToggle(show);
  });
  $login('login-forgot').addEventListener('click', function(){
    setLoginMessage('Password resets are handled by your administrator. Contact them to regain access.', 'info');
  });
  document.getElementById('logout-btn').onclick = doLogout;
}

function bindPrintOverlay(){
  document.getElementById('do-print-btn').onclick = ()=> window.print();
  document.getElementById('close-print-btn').onclick = ()=>{
    document.getElementById('print-overlay').classList.remove('show');
  };
}

/* ---------- Theme (light/dark) ---------- */
async function loadTheme(){
  try{
    const t = await window.storage.get('ui-theme-pref', false);
    return t ? JSON.parse(t.value).theme : 'light';
  }catch(e){ return 'light'; }
}
async function saveTheme(theme){
  try{ await window.storage.set('ui-theme-pref', JSON.stringify({theme}), false); }
  catch(e){ /* ignore */ }
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle-btn');
  if(btn) btn.lastChild.textContent = theme==='dark' ? ' Light Mode' : ' Dark Mode';
}
function bindThemeToggle(){
  const btn = document.getElementById('theme-toggle-btn');
  btn.onclick = async ()=>{
    const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    applyTheme(next);
    await saveTheme(next);
  };
}

/* ---------- Global header search — jumps to Order Sheet filtered by the query ---------- */
function bindGlobalSearch(){
  const input = document.getElementById('global-search');
  input.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const q = input.value.trim();
    if(!q) return;
    switchTab('list');
    setTimeout(()=>{
      const fileEl = document.getElementById('filt-file');
      if(fileEl){ fileEl.value = q; fileEl.dispatchEvent(new Event('input')); }
    }, 0);
  });
}

(async function init(){
  bindTabs();
  bindPrintOverlay();
  bindThemeToggle();
  bindGlobalSearch();
  bindLogin();

  // Theme applies even on the login screen for a consistent feel.
  const theme = await loadTheme();
  applyTheme(theme);

  // Existing login screen is retained; authentication is handled by Supabase.
  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData && sessionData.session && sessionData.session.user){
    const authUser = sessionData.session.user;
    const email = (authUser.email || '').toLowerCase();
    const role = (authUser.app_metadata && authUser.app_metadata.role) || (email==='nadeemansaries@gmail.com' ? 'cutting' : 'admin');
    CURRENT_USER = role === 'cutting'
      ? { username:'cutting', name:'Cutting', isAdmin:false, allowedTabs:['cut','issued','list'] }
      : { username:'inadeemx', name:'Admin', isAdmin:true, allowedTabs:['dashboard','new','list','cut','issued','date','challans','settings','users'] };
    showApp();
    try { await bootApp(); } catch(e) { console.error('App boot failed', e); showLogin(); }
  } else {
    showLogin();
  }
})();
</script>

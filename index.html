<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cutting Issue Tracker</title>
<style>
  :root{
    --bg:#F5F4F5;
    --paper:#FFFFFF;
    --ink:#171717;
    --grey:#777777;
    --light:#F5F4F5;
    --border:#E8E8E8;
    --red:#B3524A;      --red-bg:#FBEDEC;
    --green:#3F7A55;    --green-bg:#EAF5EE;
    --amber:#B4791F;    --amber-bg:#FCF3E3;
    --radius-card:20px;
    --radius-btn:12px;
    --radius-input:13px;
    --radius-badge:9px;
    --shadow-card:0 4px 20px rgba(0,0,0,0.04);
    --shadow-hover:0 10px 30px rgba(0,0,0,0.08);
    --t:180ms cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]{
    --bg:#0F0F10;
    --paper:#171718;
    --ink:#F5F5F5;
    --grey:#9A9A9E;
    --light:#0F0F10;
    --border:#2A2A2D;
    --red:#E0897E;      --red-bg:#3A2422;
    --green:#84C79A;    --green-bg:#1E3226;
    --amber:#E5B563;    --amber-bg:#3A2E18;
    --shadow-card:0 4px 20px rgba(0,0,0,0.25);
    --shadow-hover:0 10px 30px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background var(--t), color var(--t);
  }
  ::selection{background:rgba(23,23,23,0.12);}

  /* ---------- Shell layout: sidebar + main ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:224px;flex:none;background:var(--paper);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
    overflow-y:auto;transition:background var(--t), border-color var(--t);
  }
  .sidebar-logo{font-size:18px;font-weight:800;letter-spacing:-0.3px;padding:6px 10px 22px;color:var(--ink);}
  .sidebar-logo span{color:var(--grey);font-weight:500;}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:none;
    background:transparent;color:var(--grey);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;
    font-family:inherit;transition:background var(--t), color var(--t);width:100%;
  }
  .nav-item .nav-icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item:hover{background:var(--bg);color:var(--ink);}
  .nav-item.active{background:var(--bg);color:var(--ink);font-weight:700;}
  .sidebar-bottom{border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:2px;}

  .main{flex:1;min-width:0;}
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;padding:30px 36px 10px;gap:20px;flex-wrap:wrap;
  }
  .topbar h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-0.3px;color:var(--ink);}
  .topbar .subtitle{font-size:13px;color:var(--grey);margin:4px 0 0;font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .header-search{
    display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);
    border-radius:999px;padding:9px 16px;font-size:13px;color:var(--grey);min-width:220px;
    transition:border-color var(--t), box-shadow var(--t);
  }
  .header-search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,0.07);}
  .header-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;flex:1;color:var(--ink);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;
  }

  #content{padding:10px 36px 60px;max-width:1180px;animation:fadeIn 220ms ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);}}

  h2.section-title{
    font-size:17px;font-weight:700;letter-spacing:-0.1px;
    margin:4px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--border);color:var(--ink);
  }

  /* Forms */
  label{display:block;font-weight:600;font-size:12px;letter-spacing:0.1px;margin:16px 0 6px;color:var(--grey);}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:11px 13px;border:1px solid var(--border);background:var(--paper);border-radius:var(--radius-input);
    font-size:14px;font-weight:500;color:var(--ink);font-family:inherit;transition:border-color var(--t), box-shadow var(--t);
  }
  input:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,0.07);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:150px;}

  /* Horizontal size boxes — used wherever sizes are entered/shown in a line */
  .size-box-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .size-box{
    border:1px solid var(--border);border-radius:14px;padding:9px;width:104px;position:relative;
    background:var(--paper);flex:none;box-shadow:var(--shadow-card);
  }
  .size-box input{padding:7px 4px;font-size:13px;text-align:center;border-radius:9px;}
  .size-box .sz-input{margin-bottom:5px;}
  .size-box .rm{
    position:absolute;top:-8px;right:-8px;width:20px;height:20px;font-size:12px;line-height:1;
    padding:0;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--paper);cursor:pointer;
  }
  .size-box .cf-label{display:block;font-weight:700;font-size:11px;text-align:center;margin-bottom:5px;color:var(--ink);}
  .add-size-btn{
    margin-top:6px;background:var(--paper);border:1px dashed var(--border);color:var(--ink);border-radius:var(--radius-btn);
    font-weight:600;padding:10px 14px;cursor:pointer;font-size:13px;transition:border-color var(--t), background var(--t);
  }
  .add-size-btn:hover{border-color:var(--ink);}

  .btn-primary{
    margin-top:20px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--radius-btn);
    font-weight:700;padding:13px 20px;cursor:pointer;font-size:13.5px;width:100%;
    transition:opacity var(--t), transform var(--t);
  }
  .btn-primary:hover{opacity:0.88;}
  .btn-primary:active{transform:scale(0.99);}
  .msg{margin-top:12px;font-weight:600;font-size:13px;padding:11px 14px;border-radius:var(--radius-btn);background:var(--green-bg);color:var(--green);display:none;}
  .msg.show{display:block;}
  .msg.err{background:var(--red-bg);color:var(--red);}

  /* Ticket card — used for Cutting Issue priority queue and Daily Schedule */
  .ticket{
    border:1px solid var(--border);border-radius:var(--radius-card);margin-bottom:14px;position:relative;
    background:var(--paper);box-shadow:var(--shadow-card);overflow:hidden;transition:box-shadow var(--t);
  }
  .ticket:hover{box-shadow:var(--shadow-hover);}
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--ink);
    padding:12px 16px;font-weight:700;font-size:13px;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);
  }
  .ticket-head .po{font-size:14px;}
  .ticket-head .country{
    background:var(--paper);color:var(--ink);padding:3px 10px;font-weight:700;border-radius:var(--radius-badge);
    border:1px solid var(--border);
  }
  .ticket-body{padding:14px 16px;}
  .status-pill{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-badge);
    margin-top:8px;
  }
  .status-pending{background:var(--red-bg);color:var(--red);}
  .status-progress{background:var(--amber-bg);color:var(--amber);}
  .status-done{background:var(--green-bg);color:var(--green);}

  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filters input,.filters select{flex:1;min-width:130px;}

  .empty{
    text-align:center;padding:44px 20px;color:var(--grey);font-weight:500;font-size:14px;
    border:1px dashed var(--border);border-radius:var(--radius-card);background:var(--paper);
  }

  .qty-badge{font-size:11px;font-weight:700;padding:2px 8px;border:1px solid var(--border);border-radius:var(--radius-badge);}

  .date-group{margin-bottom:20px;}
  .date-group h3{
    font-size:12.5px;font-weight:700;letter-spacing:0.2px;
    background:var(--bg);border-left:3px solid var(--ink);padding:9px 12px;margin:0 0 10px;color:var(--ink);
    border-radius:0 10px 10px 0;
  }

  .loading{text-align:center;padding:40px;font-weight:600;color:var(--grey);}

  /* Challan generated card */
  .challan-card{
    border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 16px;margin-bottom:10px;display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--paper);box-shadow:var(--shadow-card);
  }
  .challan-card .cno{font-weight:700;font-size:13px;}
  .challan-card .cmeta{font-size:11.5px;font-weight:500;color:var(--grey);}
  .print-btn{
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-weight:600;border-radius:var(--radius-btn);
    padding:8px 15px;cursor:pointer;font-size:12px;transition:opacity var(--t);
  }
  .print-btn:hover{opacity:0.85;}

  .challan-topbar{
    display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
    border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;margin-bottom:6px;
    background:var(--paper);box-shadow:var(--shadow-card);
  }

  /* Print overlay (toolbar is on-screen chrome; printed doc keeps its plain paper styling below) */
  .print-overlay{display:none;position:fixed;inset:0;background:#ffffff;z-index:9999;overflow:auto;}
  .print-overlay.show{display:block;}
  .print-toolbar{
    position:sticky;top:0;background:var(--ink);padding:12px 18px;display:flex;gap:10px;
    justify-content:flex-end;z-index:2;
  }
  .print-toolbar button{
    font-weight:600;padding:9px 18px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);
    cursor:pointer;font-size:12.5px;border-radius:var(--radius-btn);transition:opacity var(--t);
  }
  .print-toolbar button:hover{opacity:0.85;}
  .print-toolbar button.close-btn{background:var(--ink);color:var(--paper);}

  .challan-doc{width:190mm;max-width:100%;margin:0 auto;padding:10mm;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:12px;background:#fff;}
  .challan-doc .co-name{font-size:19px;font-weight:900;margin:0;}
  .challan-doc .co-addr{font-size:11px;margin:2px 0;}
  .challan-doc .co-gst{font-size:11px;font-weight:700;}
  .challan-doc .ch-top{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;flex-wrap:wrap;gap:6px;}
  .challan-doc .ch-title{
    text-align:center;font-weight:900;font-size:13px;letter-spacing:0.5px;margin:12px 0 8px;
    border-top:1px solid #000;border-bottom:1px solid #000;padding:4px 0;text-transform:uppercase;
  }
  .challan-doc .ch-meta-line{font-size:11.5px;margin:3px 0;}
  table.challan-table{width:100%;border-collapse:collapse;margin-top:8px;}
  table.challan-table th,table.challan-table td{border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center;}
  table.challan-table th{font-weight:900;background:#eee;}
  table.challan-table td.desc{text-align:left;}
  .challan-doc .total-row td{font-weight:900;}
  .challan-sign{display:flex;justify-content:space-between;margin-top:46px;}
  .challan-sign div{border-top:1px solid #000;padding-top:5px;font-size:11px;width:30%;text-align:center;font-weight:700;}
  .challan-doc .remarks{margin-top:16px;font-size:11.5px;}

  /* Two copies side by side on one page, like the original challan */
  .challan-page{display:flex;width:277mm;max-width:100%;margin:0 auto;}
  .challan-page .challan-doc{
    flex:1 1 50%;width:auto;padding:7mm 8mm;font-size:9.5px;margin:0;
  }
  .challan-page .challan-doc:nth-child(2){border-left:1px dashed #000;}
  .challan-page .challan-doc .co-name{font-size:14px;}
  .challan-page .challan-doc .co-addr,
  .challan-page .challan-doc .co-gst,
  .challan-page .challan-doc .ch-meta-line{font-size:9px;}
  .challan-page .challan-doc .ch-title{font-size:10.5px;margin:8px 0 6px;padding:3px 0;}
  .challan-page table.challan-table th,
  .challan-page table.challan-table td{padding:3px 4px;font-size:9px;}
  .challan-page .challan-sign{margin-top:26px;}
  .challan-page .challan-sign div{font-size:9px;}
  .challan-page .remarks{margin-top:10px;font-size:9px;}

  @page{ size: A4 landscape; margin:8mm; }

  /* Order Sheet — size matrix (sizes across top, countries down the side), grouped by File then PO */
  .sheet-doc{width:277mm;max-width:100%;margin:0 auto;padding:8mm;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;}
  .sheet-doc .co-name{font-size:16px;font-weight:900;margin:0;}
  .sheet-doc .co-addr{font-size:11px;margin:2px 0 10px;}
  .sheet-file-title{font-weight:900;font-size:13px;letter-spacing:0.5px;border-top:1px solid #000;border-bottom:1px solid #000;padding:5px 0;margin:14px 0 14px;text-transform:uppercase;}
  .sheet-block{margin-bottom:18px;}
  .sheet-block-head{display:flex;gap:24px;font-size:12px;font-weight:800;margin-bottom:6px;flex-wrap:wrap;}
  table.sheet-table{width:100%;border-collapse:collapse;}
  table.sheet-table th,table.sheet-table td{border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center;}
  table.sheet-table th{font-weight:900;background:#eee;}
  table.sheet-table tr.total-row td{font-weight:900;background:#f5f5f5;}
  table.sheet-table tr.grand-total-row td{font-weight:900;background:#0a0a0a;color:#fff;}
  table.sheet-table tr.date-sep td{
    text-align:left;background:#0a0a0a;color:#fff;font-weight:900;font-size:10.5px;
    letter-spacing:0.5px;text-transform:uppercase;padding:5px 7px;
  }
  table.sheet-table tr.mii-row td{background:#ffe066;}
  table.sheet-table tr.mii-row td:first-child{font-weight:900;}
  .sheet-screen-note{font-size:12px;color:var(--grey);font-weight:700;margin-top:10px;}

  /* Issued Cutting report — File Number centered, PO in brackets, Common / Made In India / Total rows */
  .issued-doc{width:277mm;max-width:100%;margin:0 auto;padding:8mm;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;}
  .issued-file-title{text-align:center;font-size:20px;font-weight:900;margin:4px 0 22px;letter-spacing:0.5px;text-transform:uppercase;}
  .issued-po-block{margin-bottom:26px;}
  .issued-po-title{text-align:center;font-weight:900;font-size:14px;margin-bottom:8px;}
  table.issued-table{width:100%;border-collapse:collapse;}
  table.issued-table th,table.issued-table td{border:1px solid #000;padding:6px 8px;font-size:12px;text-align:center;}
  table.issued-table th{font-weight:900;background:#eee;}
  table.issued-table tr.row-common td:first-child{text-align:left;font-weight:900;}
  table.issued-table tr.row-mii td{background:#ffe066;}
  table.issued-table tr.row-mii td:first-child{text-align:left;font-weight:900;}
  table.issued-table tr.row-total td{font-weight:900;background:#0a0a0a;color:#fff;}

  /* Dashboard */
  .dash-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .dash-filters input,.dash-filters select{flex:1;min-width:130px;}
  .dash-filters .search-box{flex:2;min-width:200px;}
  .dash-filter-btns{display:flex;gap:8px;margin-bottom:24px;}
  .dash-filter-btns button{
    border:1px solid var(--border);background:var(--paper);color:var(--ink);font-weight:600;border-radius:var(--radius-btn);
    padding:9px 16px;cursor:pointer;font-size:12.5px;transition:background var(--t), opacity var(--t);
  }
  .dash-filter-btns button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .dash-filter-btns button:hover{opacity:0.85;}

  .dash-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .dash-card{
    border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;position:relative;
    background:var(--paper);box-shadow:var(--shadow-card);transition:box-shadow var(--t), transform var(--t);
  }
  .dash-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .dash-card:first-child{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .dash-card:first-child .label{color:rgba(255,255,255,0.65);}
  .dash-card .icon{font-size:16px;position:absolute;top:16px;right:16px;opacity:0.45;}
  .dash-card .num{font-size:24px;font-weight:800;line-height:1;letter-spacing:-0.3px;}
  .dash-card .label{font-size:12px;font-weight:500;color:var(--grey);margin-top:8px;}
  .dash-card .delta{font-size:11.5px;font-weight:600;margin-top:8px;}
  .dash-card .delta.up{color:var(--green);}
  .dash-card .delta.warn{color:var(--red);}

  .dash-section{margin-bottom:32px;}
  .dash-section-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;
  }
  .dash-section-head h3{
    font-size:15px;font-weight:700;letter-spacing:-0.1px;margin:0;color:var(--ink);
  }
  .view-all-btn{
    background:var(--paper);border:1px solid var(--border);color:var(--ink);font-weight:600;border-radius:var(--radius-btn);
    padding:7px 15px;cursor:pointer;font-size:12px;flex:none;transition:border-color var(--t), background var(--t);
  }
  .view-all-btn:hover{border-color:var(--ink);}

  .dash-table-wrap{
    overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--paper);
    box-shadow:var(--shadow-card);
  }
  table.dash-table{width:100%;border-collapse:collapse;min-width:600px;}
  table.dash-table th,table.dash-table td{padding:12px 14px;font-size:13px;text-align:left;border-bottom:1px solid var(--border);}
  table.dash-table th{background:transparent;color:var(--grey);font-weight:600;font-size:11.5px;letter-spacing:0.2px;}
  table.dash-table tr:last-child td{border-bottom:none;}
  table.dash-table tbody tr{transition:background var(--t);}
  table.dash-table tbody tr:hover{background:var(--bg);}
  table.dash-table tr.mii-row td{background:var(--amber-bg);}

  .badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--radius-badge);}
  .badge-pending{background:var(--red-bg);color:var(--red);}
  .badge-progress{background:var(--amber-bg);color:var(--amber);}
  .badge-completed{background:var(--green-bg);color:var(--green);}
  .badge-high{background:var(--red-bg);color:var(--red);}
  .badge-medium{background:var(--amber-bg);color:var(--amber);}
  .badge-low{background:var(--bg);color:var(--grey);}

  .progress-item{
    border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;margin-bottom:10px;
    background:var(--paper);box-shadow:var(--shadow-card);
  }
  .progress-item .p-head{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .progress-bar-track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--ink);border-radius:99px;transition:width 400ms ease;}
  .progress-item .p-meta{font-size:11.5px;color:var(--grey);font-weight:500;margin-top:8px;}

  .quick-actions{display:flex;flex-wrap:wrap;gap:10px;}
  .quick-actions button{
    flex:1;min-width:160px;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:var(--radius-btn);
    font-weight:600;padding:14px 10px;cursor:pointer;font-size:13px;box-shadow:var(--shadow-card);
    transition:background var(--t), color var(--t), transform var(--t);
  }
  .quick-actions button:hover{background:var(--ink);color:var(--paper);transform:translateY(-1px);}

  .dash-widget-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dash-widget{
    border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;background:var(--paper);box-shadow:var(--shadow-card);
  }
  .dash-widget h4{margin:0 0 14px;font-size:14px;font-weight:700;letter-spacing:-0.1px;color:var(--ink);}
  .dash-widget-stats{display:flex;justify-content:space-between;text-align:center;margin-bottom:16px;}
  .dash-widget-stats div span{display:block;}
  .dash-widget-stats .n{font-size:19px;font-weight:800;}
  .dash-widget-stats .l{font-size:10.5px;font-weight:500;color:var(--grey);margin-top:4px;}

  @media (max-width:980px){
    .sidebar{position:fixed;left:0;top:0;width:100%;height:auto;flex-direction:row;align-items:center;
      padding:10px 14px;overflow-x:auto;overflow-y:hidden;z-index:50;border-right:none;border-bottom:1px solid var(--border);}
    .sidebar-logo{padding:0 14px 0 4px;flex:none;}
    .sidebar-nav{flex-direction:row;flex:none;}
    .nav-item{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 10px;white-space:nowrap;}
    .sidebar-bottom{flex-direction:row;border-top:none;border-left:1px solid var(--border);margin:0 0 0 8px;padding:0 0 0 10px;}
    .main{padding-top:64px;}
    .dash-cards{grid-template-columns:repeat(2,1fr);}
    .dash-widget-row{grid-template-columns:1fr;}
    #content{padding:10px 18px 60px;}
    .topbar{padding:18px 18px 10px;}
  }
  @media (max-width:480px){
    .dash-cards{grid-template-columns:1fr 1fr;}
    .header-search{min-width:0;flex:1;}
    .topbar-right{width:100%;}
  }


  @media print{
    body *{visibility:hidden;}
    .print-toolbar{display:none !important;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;}
  }

  /* ---------- iOS style Login ---------- */
  .avatar{overflow:hidden;padding:0;border:2px solid #D70015;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;}
  #login-screen{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:24px;background:#FFFFFF;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:#000;
  }
  #login-screen.hide{display:none;}
  #login-screen .blob{position:absolute;border-radius:50%;pointer-events:none;}
  #login-screen .blob.b1{width:520px;height:520px;top:-240px;right:-160px;background:radial-gradient(circle at 30% 30%,#FF453A,#D70015);opacity:.95;}
  #login-screen .blob.b2{width:340px;height:340px;bottom:-170px;left:-120px;background:radial-gradient(circle at 30% 30%,#FF6B61,#E0202E);opacity:.9;}
  .login-card{
    position:relative;width:100%;max-width:380px;background:rgba(255,255,255,.88);
    -webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
    border-radius:30px;padding:36px 26px 26px;box-shadow:0 24px 60px rgba(215,0,21,.20),0 2px 8px rgba(0,0,0,.06);
    border:1px solid rgba(0,0,0,.05);animation:loginIn 480ms cubic-bezier(.2,.9,.3,1);
  }
  @keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
  .login-avatar{
    width:104px;height:104px;margin:0 auto 18px;border-radius:50%;padding:4px;
    background:linear-gradient(145deg,#FF453A,#D70015);box-shadow:0 10px 26px rgba(215,0,21,.38);
  }
  .login-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:3px solid #fff;background:#fff;}
  .login-icon{
    width:76px;height:76px;margin:0 auto 18px;border-radius:19px;background:linear-gradient(145deg,#FF453A,#D70015);
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(215,0,21,.35);
  }
  .login-icon svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .login-card h1{margin:0;text-align:center;font-size:29px;font-weight:800;letter-spacing:-.6px;color:#000;}
  .login-card .sub{margin:6px 0 26px;text-align:center;font-size:15px;font-weight:700;color:#000;opacity:.6;}
  .ios-group{background:#fff;border-radius:14px;border:1px solid #E5E5EA;overflow:hidden;}
  .ios-field{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;}
  .ios-field + .ios-field{border-top:1px solid #E5E5EA;}
  .ios-field svg{width:20px;height:20px;flex:none;fill:none;stroke:#D70015;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ios-field input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;
    font-size:17px;font-weight:700;color:#000;padding:0;height:100%;box-shadow:none;border-radius:0;
  }
  .ios-field input::placeholder{color:#8E8E93;font-weight:600;}
  .ios-field input:focus{box-shadow:none;border:none;}
  .ios-field:focus-within{background:#FFF5F4;}
  .eye-btn{border:none;background:transparent;color:#D70015;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;padding:6px 2px;}
  .login-error{min-height:20px;margin:12px 4px 0;font-size:13.5px;font-weight:800;color:#D70015;text-align:center;}
  .login-error.shake{animation:shake 360ms;}
  @keyframes shake{20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
  .login-btn{
    width:100%;margin-top:8px;height:54px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#FF453A,#D70015);color:#fff;font-family:inherit;
    font-size:17px;font-weight:800;letter-spacing:.1px;box-shadow:0 8px 20px rgba(215,0,21,.35);
    transition:transform 120ms ease,filter 120ms ease;
  }
  .login-btn:active{transform:scale(.97);filter:brightness(.93);}
  .login-foot{margin-top:18px;text-align:center;font-size:12px;font-weight:700;color:#000;opacity:.45;}
</style>
</head>

<script>
let ORDERS = [];
let ENTRIES = [];
let CHALLANS = [];
let CHALLAN_COUNTER = 0;
let COMPANY = {
  name: 'VIRAJ EXPORTS PVT. LTD.',
  addr: 'C-66, Sector - 57, Noida, U.P. 201 301',
  gst: '09AABCV3062D1ZK',
  issuedTo: 'Prod unit-C-66 - Sect-57'
};
let ready = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadAll(){
  try{
    const o = await window.storage.get('orders-data', false);
    ORDERS = o ? JSON.parse(o.value) : [];
  }catch(e){ ORDERS = []; }
  try{
    const c = await window.storage.get('cutting-entries-data', false);
    ENTRIES = c ? JSON.parse(c.value) : [];
  }catch(e){ ENTRIES = []; }
  try{
    const ch = await window.storage.get('challans-data', false);
    CHALLANS = ch ? JSON.parse(ch.value) : [];
  }catch(e){ CHALLANS = []; }
  try{
    const cnt = await window.storage.get('challan-counter-data', false);
    CHALLAN_COUNTER = cnt ? Number(JSON.parse(cnt.value).value) : 0;
  }catch(e){ CHALLAN_COUNTER = 0; }
  try{
    const comp = await window.storage.get('company-settings-data', false);
    if(comp){ COMPANY = Object.assign({}, COMPANY, JSON.parse(comp.value)); }
  }catch(e){ /* keep default COMPANY */ }
  ready = true;
}

async function saveOrders(){
  try{ await window.storage.set('orders-data', JSON.stringify(ORDERS), false); }
  catch(e){ console.error('save orders failed', e); }
}
async function saveEntries(){
  try{ await window.storage.set('cutting-entries-data', JSON.stringify(ENTRIES), false); }
  catch(e){ console.error('save entries failed', e); }
}
async function saveChallans(){
  try{ await window.storage.set('challans-data', JSON.stringify(CHALLANS), false); }
  catch(e){ console.error('save challans failed', e); }
}
async function saveCompany(){
  try{ await window.storage.set('company-settings-data', JSON.stringify(COMPANY), false); }
  catch(e){ console.error('save company failed', e); }
}
async function nextChallanNo(){
  CHALLAN_COUNTER += 1;
  try{ await window.storage.set('challan-counter-data', JSON.stringify({value:CHALLAN_COUNTER}), false); }
  catch(e){ console.error('save counter failed', e); }
  return String(CHALLAN_COUNTER).padStart(4,'0');
}

function issuedForOrder(orderId){
  const map = {};
  ENTRIES.filter(e=>e.orderId===orderId).forEach(e=>{
    e.sizes.forEach(s=>{ map[s.size] = (map[s.size]||0) + Number(s.qty); });
  });
  return map;
}

function orderStatus(order){
  const issued = issuedForOrder(order.id);
  let target=0, done=0;
  order.sizes.forEach(s=>{ target += Number(s.qty); done += Number(issued[s.size]||0); });
  if(done<=0) return {label:'Pending', cls:'status-pending', done, target};
  if(done>=target) return {label:'Complete', cls:'status-done', done, target};
  return {label:'In Progress', cls:'status-progress', done, target};
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- TAB: DASHBOARD ---------- */
function fmtNum(n){ return Number(n||0).toLocaleString('en-IN'); }

function getFilteredOrdersForDashboard(f){
  return ORDERS.filter(o=>{
    if(f.file && !(o.fileNumber||'').toLowerCase().includes(f.file)) return false;
    if(f.po && !o.po.toLowerCase().includes(f.po)) return false;
    if(f.country && !o.country.toLowerCase().includes(f.country)) return false;
    if(f.status){
      const st = orderStatus(o).label;
      if(f.status==='Pending' && st!=='Pending') return false;
      if(f.status==='In Progress' && st!=='In Progress') return false;
      if(f.status==='Complete' && st!=='Complete') return false;
    }
    if(f.from && o.date < f.from) return false;
    if(f.to && o.date > f.to) return false;
    if(f.search){
      const hay = `${o.fileNumber} ${o.po} ${o.country}`.toLowerCase();
      if(!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function statusBadgeClass(label){
  if(label==='Pending') return 'badge-pending';
  if(label==='In Progress') return 'badge-progress';
  return 'badge-completed';
}

function renderDashboard(){
  const c = document.getElementById('content');
  const today = new Date().toISOString().slice(0,10);

  c.innerHTML = `
    <h2 class="section-title">Cutting Tracker Dashboard</h2>
    <div class="dash-filters">
      <input type="text" class="search-box" id="db-search" placeholder="Search Order / File / PO / Country / Challan...">
      <input type="text" id="db-file" placeholder="File Number">
      <input type="text" id="db-po" placeholder="PO Number">
      <input type="text" id="db-country" placeholder="Country">
      <select id="db-status">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Complete">Completed</option>
      </select>
      <input type="date" id="db-from" title="From date">
      <input type="date" id="db-to" title="To date">
    </div>
    <div class="dash-filter-btns">
      <button type="button" class="primary" id="db-apply">Apply Filter</button>
      <button type="button" id="db-reset">Reset</button>
    </div>
    <div id="db-body"></div>
  `;

  const body = document.getElementById('db-body');

  function draw(){
    const f = {
      search: document.getElementById('db-search').value.trim().toLowerCase(),
      file: document.getElementById('db-file').value.trim().toLowerCase(),
      po: document.getElementById('db-po').value.trim().toLowerCase(),
      country: document.getElementById('db-country').value.trim().toLowerCase(),
      status: document.getElementById('db-status').value,
      from: document.getElementById('db-from').value,
      to: document.getElementById('db-to').value
    };
    const orders = getFilteredOrdersForDashboard(f);

    // ---- summary card stats ----
    let totalOrderQty=0, totalCutQty=0, pending=0, inProgress=0, completed=0;
    const statuses = orders.map(o=>{
      const st = orderStatus(o);
      totalOrderQty += st.target;
      totalCutQty += st.done;
      if(st.label==='Pending') pending++;
      else if(st.label==='In Progress') inProgress++;
      else completed++;
      return {order:o, st};
    });
    const activeOrders = pending + inProgress;
    const filteredFileNumbers = new Set(orders.map(o=>o.fileNumber));
    const relevantChallans = CHALLANS.filter(ch=> filteredFileNumbers.has(ch.fileNumber));

    const cards = [
      {label:'Total Orders', num: orders.length, icon:'📋'},
      {label:'Active Orders', num: activeOrders, icon:'⚙️'},
      {label:'Pending Cutting', num: pending, icon:'⏳'},
      {label:'Cutting In Progress', num: inProgress, icon:'✂️'},
      {label:'Cutting Completed', num: completed, icon:'✅'},
      {label:'Total Order Qty (Pcs)', num: fmtNum(totalOrderQty), icon:'📦'},
      {label:'Total Pcs Cut', num: fmtNum(totalCutQty), icon:'🧵'},
      {label:'Total Challans', num: relevantChallans.length, icon:'🧾'}
    ];
    const cardsHtml = cards.map(cd=>`
      <div class="dash-card">
        <span class="icon">${cd.icon}</span>
        <div class="num">${cd.num}</div>
        <div class="label">${cd.label}</div>
      </div>
    `).join('');

    // ---- today's cutting status ----
    const todayOrders = statuses.filter(x=>x.order.date===today);
    const todayRowsHtml = todayOrders.length ? todayOrders.map(x=>{
      const o = x.order;
      const mii = o.origin==='MADE IN INDIA';
      return `<tr class="${mii?'mii-row':''}">
        <td>${escapeHtml(o.fileNumber)}</td><td>${escapeHtml(o.po)}</td><td>${escapeHtml(o.country)}</td>
        <td>${escapeHtml(o.color||'-')}</td><td>${x.st.target}</td><td>${x.st.done}</td>
        <td>${Math.max(0,x.st.target-x.st.done)}</td>
        <td><span class="badge ${statusBadgeClass(x.st.label)}">${x.st.label}</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--grey);">No cutting scheduled for today.</td></tr>`;

    // ---- cutting progress (active orders) ----
    const activeList = statuses.filter(x=>x.st.label!=='Complete').slice(0,6);
    const progressHtml = activeList.length ? activeList.map(x=>{
      const o=x.order, st=x.st;
      const pct = st.target>0 ? Math.round((st.done/st.target)*100) : 0;
      return `
        <div class="progress-item">
          <div class="p-head"><span>File ${escapeHtml(o.fileNumber)} — PO ${escapeHtml(o.po)} — ${escapeHtml(o.country)}</span><span>${pct}%</span></div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
          <div class="p-meta">Planned: ${st.target} PCS &nbsp;|&nbsp; Cut: ${st.done} PCS &nbsp;|&nbsp; Balance: ${Math.max(0,st.target-st.done)} PCS</div>
        </div>
      `;
    }).join('') : `<div class="empty">No active orders in progress.</div>`;

    // ---- recent cutting issues (challans) ----
    const recentChallans = relevantChallans.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
    const recentChallansHtml = recentChallans.length ? recentChallans.map(ch=>{
      const qty = ch.rows.reduce((s,r)=>s+Number(r.qty),0);
      const countries = [...new Set(ch.rows.map(r=>r.country))].join(', ');
      return `<tr>
        <td>${escapeHtml(ch.challanNo)}</td><td>${escapeHtml(ch.fileNumber)}</td><td>${escapeHtml(ch.po)}</td>
        <td>${ch.date}</td><td>${escapeHtml(countries)}</td><td>${qty}</td><td>${escapeHtml(ch.issuedTo||'-')}</td>
        <td><span class="badge badge-completed">Issued</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--grey);">No cutting issues yet.</td></tr>`;

    // ---- recent issued cutting (entries) ----
    const relevantOrderIds = new Set(orders.map(o=>o.id));
    const recentEntries = ENTRIES.filter(e=>relevantOrderIds.has(e.orderId)).slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
    const recentEntriesHtml = recentEntries.length ? recentEntries.map(e=>{
      const o = ORDERS.find(x=>x.id===e.orderId);
      if(!o) return '';
      const qty = e.sizes.reduce((s,sz)=>s+Number(sz.qty),0);
      const sizesTxt = e.sizes.map(sz=>`${sz.size}:${sz.qty}`).join(', ');
      const mii = o.origin==='MADE IN INDIA';
      return `<tr class="${mii?'mii-row':''}">
        <td>${escapeHtml(o.fileNumber)}</td><td>${escapeHtml(o.po)}</td><td>${escapeHtml(o.country)}</td>
        <td>${escapeHtml(o.color||'-')}</td><td>${escapeHtml(sizesTxt)}</td><td>${qty}</td><td>${e.date}</td>
        <td><span class="badge badge-completed">Recorded</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--grey);">No issued cutting recorded yet.</td></tr>`;

    // ---- daily schedule (upcoming) ----
    const upcoming = statuses.filter(x=>x.order.date>=today).slice().sort((a,b)=>a.order.date.localeCompare(b.order.date)).slice(0,8);
    const scheduleHtml = upcoming.length ? upcoming.map(x=>{
      const o = x.order;
      const days = (new Date(o.date) - new Date(today)) / 86400000;
      const priority = days<=2 ? 'High' : (days<=7 ? 'Medium' : 'Low');
      const prCls = priority==='High' ? 'badge-high' : (priority==='Medium' ? 'badge-medium' : 'badge-low');
      return `<tr>
        <td>${o.date}</td><td>${escapeHtml(o.fileNumber)}</td><td>${escapeHtml(o.po)}</td><td>${escapeHtml(o.country)}</td>
        <td>${x.st.target}</td><td>${escapeHtml(o.origin==='MADE IN INDIA'?'Made In India':'Common')}</td>
        <td><span class="badge ${prCls}">${priority}</span></td>
        <td><span class="badge ${statusBadgeClass(x.st.label)}">${x.st.label}</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--grey);">No upcoming schedule.</td></tr>`;

    // ---- challan summary widget ----
    const totalQtyIssued = relevantChallans.reduce((s,ch)=> s + ch.rows.reduce((s2,r)=>s2+Number(r.qty),0), 0);
    const filesWithChallans = new Set(relevantChallans.map(ch=>ch.fileNumber)).size;

    // ---- order overview ----
    const overviewList = statuses.slice(0,10);
    const overviewHtml = overviewList.length ? overviewList.map(x=>{
      const o=x.order, st=x.st;
      const mii = o.origin==='MADE IN INDIA';
      return `<tr class="${mii?'mii-row':''}">
        <td>${escapeHtml(o.fileNumber)}</td><td>${escapeHtml(o.po)}</td><td>${escapeHtml(o.country)}</td>
        <td>${escapeHtml(o.origin==='MADE IN INDIA'?'Made In India':'Common')}</td>
        <td>${st.target}</td><td>${st.done}</td><td>${Math.max(0,st.target-st.done)}</td>
        <td>${o.date}</td><td><span class="badge ${statusBadgeClass(st.label)}">${st.label}</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--grey);">No orders match the current filters.</td></tr>`;

    body.innerHTML = `
      <div class="dash-cards">${cardsHtml}</div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Today's Cutting Status</h3></div>
        <div class="dash-table-wrap"><table class="dash-table">
          <tr><th>File No</th><th>PO No</th><th>Country</th><th>Color</th><th>Planned</th><th>Cut</th><th>Balance</th><th>Status</th></tr>
          ${todayRowsHtml}
        </table></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Cutting Progress</h3></div>
        ${progressHtml}
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Recent Cutting Issues</h3><button type="button" class="view-all-btn" data-goto="cut">View All</button></div>
        <div class="dash-table-wrap"><table class="dash-table">
          <tr><th>Challan No</th><th>File No</th><th>PO No</th><th>Date</th><th>Countries</th><th>Qty</th><th>Issued To</th><th>Status</th></tr>
          ${recentChallansHtml}
        </table></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Recent Issued Cutting</h3><button type="button" class="view-all-btn" data-goto="issued">View All</button></div>
        <div class="dash-table-wrap"><table class="dash-table">
          <tr><th>File No</th><th>PO No</th><th>Country</th><th>Color</th><th>Sizes</th><th>Qty</th><th>Date</th><th>Status</th></tr>
          ${recentEntriesHtml}
        </table></div>
      </div>

      <div class="dash-widget-row">
        <div class="dash-widget">
          <h4>Daily Schedule</h4>
          <div class="dash-table-wrap"><table class="dash-table">
            <tr><th>Date</th><th>File</th><th>PO</th><th>Country</th><th>Qty</th><th>Origin</th><th>Priority</th><th>Status</th></tr>
            ${scheduleHtml}
          </table></div>
          <button type="button" class="view-all-btn" style="margin-top:12px;" data-goto="date">View Daily Schedule</button>
        </div>
        <div class="dash-widget">
          <h4>Challan Summary</h4>
          <div class="dash-widget-stats">
            <div><span class="n">${relevantChallans.length}</span><span class="l">Total Challans</span></div>
            <div><span class="n">${filesWithChallans}</span><span class="l">Files Covered</span></div>
            <div><span class="n">${fmtNum(totalQtyIssued)}</span><span class="l">Pcs Issued</span></div>
          </div>
          <button type="button" class="view-all-btn" data-goto="challans">View Challans</button>
        </div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Order Overview</h3><button type="button" class="view-all-btn" data-goto="list">View Order Sheet</button></div>
        <div class="dash-table-wrap"><table class="dash-table">
          <tr><th>File No</th><th>PO No</th><th>Country</th><th>Origin</th><th>Order Qty</th><th>Cut Qty</th><th>Balance</th><th>Cutting Date</th><th>Status</th></tr>
          ${overviewHtml}
        </table></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head"><h3>Quick Actions</h3></div>
        <div class="quick-actions">
          <button type="button" data-goto="new">+ Add New Order</button>
          <button type="button" data-goto="cut">+ New Cutting Issue</button>
          <button type="button" data-goto="issued">+ Issued Cutting</button>
          <button type="button" data-goto="date">+ Daily Schedule</button>
          <button type="button" data-goto="cut">+ New Challan</button>
          <button type="button" data-goto="list">+ View Order Sheet</button>
        </div>
      </div>
    `;

    body.querySelectorAll('[data-goto]').forEach(btn=>{
      btn.onclick = ()=> switchTab(btn.dataset.goto);
    });
  }

  document.getElementById('db-apply').onclick = draw;
  document.getElementById('db-reset').onclick = ()=>{
    document.getElementById('db-search').value='';
    document.getElementById('db-file').value='';
    document.getElementById('db-po').value='';
    document.getElementById('db-country').value='';
    document.getElementById('db-status').value='';
    document.getElementById('db-from').value='';
    document.getElementById('db-to').value='';
    draw();
  };
  document.getElementById('db-search').addEventListener('input', draw);
  draw();
}

/* ---------- TAB: ADD ORDER ---------- */
function renderNew(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <h2 class="section-title">Add File / PO / Country Entry</h2>
    <div class="row">
      <div>
        <label>File Number</label>
        <input type="text" id="f-file" placeholder="e.g. F-101" list="file-list">
        <datalist id="file-list">${[...new Set(ORDERS.map(o=>o.fileNumber).filter(Boolean))].map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
      </div>
      <div>
        <label>PO Number</label>
        <input type="text" id="f-po" placeholder="e.g. PO-4521">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Country Code</label>
        <input type="text" id="f-country" placeholder="e.g. US, UK, AE" style="text-transform:uppercase">
      </div>
      <div>
        <label>Origin</label>
        <select id="f-origin">
          <option value="COMMON">Common</option>
          <option value="MADE IN INDIA">Made In India</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Cutting Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Color (optional)</label>
        <input type="text" id="f-color" placeholder="e.g. Dark Red">
      </div>
    </div>

    <label>Size-wise Order Quantity</label>
    <div id="size-rows" class="size-box-wrap"></div>
    <button type="button" class="add-size-btn" id="add-size-btn">+ Add Size</button>

    <button type="button" class="btn-primary" id="save-order-btn">Save Order</button>
    <div class="msg" id="new-msg"></div>
  `;
  const sizeRows = document.getElementById('size-rows');
  function addSizeRow(size='', qty=''){
    const div = document.createElement('div');
    div.className='size-box';
    div.innerHTML = `
      <button type="button" class="rm">×</button>
      <input type="number" placeholder="Size" class="sz-input" value="${size}">
      <input type="number" placeholder="Qty" class="qty-input" value="${qty}">
    `;
    div.querySelector('.rm').onclick = ()=> div.remove();
    sizeRows.appendChild(div);
  }
  addSizeRow(); addSizeRow(); addSizeRow();
  document.getElementById('add-size-btn').onclick = ()=> addSizeRow();

  document.getElementById('save-order-btn').onclick = async ()=>{
    const fileNumber = document.getElementById('f-file').value.trim();
    const po = document.getElementById('f-po').value.trim();
    const country = document.getElementById('f-country').value.trim().toUpperCase();
    const origin = document.getElementById('f-origin').value;
    const date = document.getElementById('f-date').value;
    const color = document.getElementById('f-color').value.trim();
    const sizes = [];
    sizeRows.querySelectorAll('.size-box').forEach(row=>{
      const sz = row.querySelector('.sz-input').value.trim();
      const qty = row.querySelector('.qty-input').value.trim();
      if(sz!=='' && qty!==''){ sizes.push({size:sz, qty:Number(qty)}); }
    });
    const msg = document.getElementById('new-msg');
    if(!fileNumber || !po || !country || !date || sizes.length===0){
      msg.textContent = 'File Number, PO Number, Country Code, Date, and at least one Size are required.';
      msg.className='msg err show';
      return;
    }
    ORDERS.push({id:uid(), fileNumber, po, country, origin, date, color, sizes, createdAt:Date.now()});
    await saveOrders();
    msg.textContent = 'Order saved — File ' + fileNumber + ' / PO ' + po + ' / ' + country;
    msg.className='msg show';
    // Keep File Number, PO Number, Color, Origin AND the Size numbers as-is —
    // only clear Country and the Quantities, so the user can quickly add the next country.
    document.getElementById('f-country').value='';
    sizeRows.querySelectorAll('.qty-input').forEach(inp=> inp.value='');
    document.getElementById('f-country').focus();
  };
}

/* ---------- ORDER SHEET — shared size-matrix builder (sizes across top, countries down, grouped by File then PO, then Cutting Date) ---------- */
function groupOrdersByFile(orders){
  const fileOrder = [];
  const byFile = {};
  orders.forEach(o=>{
    const key = o.fileNumber || '(No File Number)';
    if(!byFile[key]){ byFile[key]=[]; fileOrder.push(key); }
    byFile[key].push(o);
  });
  return {fileOrder, byFile};
}

function buildFileBlockHtml(fileNumber, ordersForFile){
  // group by PO, preserving entry sequence
  const poOrder = [];
  const byPo = {};
  ordersForFile.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>{
    if(!byPo[o.po]){ byPo[o.po]=[]; poOrder.push(o.po); }
    byPo[o.po].push(o);
  });

  const poBlocks = poOrder.map(po=>{
    const orders = byPo[po];
    const sizeSet = [];
    orders.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
    sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));
    const color = orders.find(o=>o.color)?.color || '';

    // group countries by Cutting Date — same date = one section together
    const dateOrder = [];
    const byDate = {};
    orders.forEach(o=>{
      if(!byDate[o.date]){ byDate[o.date]=[]; dateOrder.push(o.date); }
      byDate[o.date].push(o);
    });
    dateOrder.sort();

    const grandColTotals = {}; sizeSet.forEach(s=>grandColTotals[s]=0);
    let grand = 0;

    const dateSectionsHtml = dateOrder.map(date=>{
      const dateOrders = byDate[date];
      const colTotals = {}; sizeSet.forEach(s=>colTotals[s]=0);
      let dateTotal = 0;
      const rows = dateOrders.map(o=>{
        const bySize={}; o.sizes.forEach(s=>bySize[s.size]=Number(s.qty));
        let rowTotal=0;
        const cells = sizeSet.map(sz=>{
          const q = bySize[sz]||0; rowTotal+=q; colTotals[sz]+=q; grandColTotals[sz]+=q;
          return `<td>${q>0?q:'-'}</td>`;
        }).join('');
        dateTotal += rowTotal;
        const isMii = o.origin==='MADE IN INDIA';
        const originTag = isMii ? ' (MADE IN INDIA)' : '';
        return `<tr class="${isMii?'mii-row':''}"><td style="text-align:left;font-weight:800;">${escapeHtml(o.country)}${escapeHtml(originTag)}</td>${cells}<td><b>${rowTotal}</b></td></tr>`;
      }).join('');
      grand += dateTotal;
      const subtotalCells = sizeSet.map(sz=>`<td>${colTotals[sz]}</td>`).join('');
      return `
        <tr class="date-sep"><td colspan="${sizeSet.length+2}">Cutting Date: ${escapeHtml(date)}</td></tr>
        ${rows}
        <tr class="total-row"><td>TOTAL</td>${subtotalCells}<td>${dateTotal}</td></tr>
      `;
    }).join('');

    const grandCells = sizeSet.map(sz=>`<td>${grandColTotals[sz]}</td>`).join('');
    return `
      <div class="sheet-block">
        <div class="sheet-block-head">
          <span>PO: ${escapeHtml(po)}</span>
          <span>Color: ${escapeHtml(color||'-')}</span>
          <span>Total Qty: ${grand}</span>
        </div>
        <table class="sheet-table">
          <tr><th>Country</th>${sizeSet.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('')}<th>Total</th></tr>
          ${dateSectionsHtml}
          <tr class="grand-total-row"><td>GRAND TOTAL</td>${grandCells}<td>${grand}</td></tr>
        </table>
      </div>
    `;
  }).join('');

  return `<div class="sheet-file-title">FILE NO - ${escapeHtml(fileNumber)}</div>${poBlocks}`;
}

function buildOrderSheetHtml(orders){
  if(orders.length===0) return '';
  const {fileOrder, byFile} = groupOrdersByFile(orders);
  const sections = fileOrder.map(fn=>buildFileBlockHtml(fn, byFile[fn])).join('');
  return `
    <div class="sheet-doc">
      <p class="co-name">${escapeHtml(COMPANY.name)}</p>
      <p class="co-addr">${escapeHtml(COMPANY.addr)}</p>
      ${sections}
    </div>
  `;
}

/* ---------- TAB: CUTTING ISSUE ENTRY ---------- */
// Given a fileNumber (and optional origin filter), sorted list of orders (POs) in that file, earliest cutting date first.
function ordersInFile(fileNumber, origin){
  return ORDERS.filter(o=> o.fileNumber===fileNumber && (!origin || (o.origin||'COMMON')===origin))
    .sort((a,b)=> a.date.localeCompare(b.date) || a.createdAt-b.createdAt);
}

// Allocate an entered qty (per size) across the file's POs matching the given Origin, earliest cutting date first.
function allocateForFile(fileNumber, sizeQtyMap, origin){
  const list = ordersInFile(fileNumber, origin);
  const result = [];
  for(const size in sizeQtyMap){
    let remaining = Number(sizeQtyMap[size]);
    if(!(remaining>0)) continue;
    const allocations = [];
    for(const order of list){
      if(remaining<=0) break;
      const sizeEntry = order.sizes.find(s=>String(s.size)===String(size));
      if(!sizeEntry) continue;
      const issued = issuedForOrder(order.id)[size] || 0;
      const need = sizeEntry.qty - issued;
      if(need<=0) continue;
      const give = Math.min(need, remaining);
      allocations.push({orderId:order.id, po:order.po, country:order.country, date:order.date, qty:give});
      remaining -= give;
    }
    result.push({size, allocations, unallocated: remaining});
  }
  return result;
}

function renderCut(){
  const c = document.getElementById('content');
  if(ORDERS.length===0){
    c.innerHTML = `<h2 class="section-title">Cutting Issue Entry</h2><div class="empty">Please add a File / PO / Country entry first from the "Add Order" tab.</div>`;

  }

  let pendingChallanNo = null; // reserved via "New", consumed by the next save

  c.innerHTML = `
    <h2 class="section-title">Cutting Issue Entry</h2>
    <div class="challan-topbar">
      <div>
        <label style="margin:0 0 4px;">Challan No</label>
        <div id="cf-challan-display" style="font-size:20px;font-weight:900;">Will be assigned on save</div>
      </div>

  `;

  const bodyBox = document.getElementById('cf-body');
  const challanDisplay = document.getElementById('cf-challan-display');

  function renderCreateMode(){
    challanDisplay.textContent = pendingChallanNo ? (pendingChallanNo + ' (new — not yet saved)') : 'Will be assigned on save';
    const fileNumbers = [...new Set(ORDERS.map(o=>o.fileNumber).filter(Boolean))].sort();
    bodyBox.innerHTML = `
      <label>File Number</label>
      <input type="text" id="cf-file" placeholder="Enter file number" list="cf-file-list">
      <datalist id="cf-file-list">${fileNumbers.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
      <div id="cf-form"></div>
    `;
    const formBox = document.getElementById('cf-form');

    function renderDynamic(fileNumber, origin, dynamicBox){
      const list = ordersInFile(fileNumber, origin);
      if(list.length===0){
        dynamicBox.innerHTML = '<div class="empty">No orders found in this File Number for the selected Origin.</div>';
        return;
      }
      const sizeSet = [];
      list.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
      const today = new Date().toISOString().slice(0,10);
      const rows = sizeSet.map(sz=>`
        <div class="size-box">
          <span class="cf-label">${escapeHtml(String(sz))}</span>
          <input type="number" class="cf-qty-input" data-size="${escapeHtml(String(sz))}" placeholder="Pcs" min="0">
        </div>
      `).join('');
      const lineOptions = Array.from({length:10}, (_,i)=>i+1).map(n=>`<option value="${n}">Line ${n}</option>`).join('');
      dynamicBox.innerHTML = `
        <label>Cutting Issue Date</label>
        <input type="date" id="cf-date" value="${today}">
        <label>Production Line</label>
        <select id="cf-line">${lineOptions}</select>
        <label>Size-wise Quantity (Cut Today)</label>
        <div class="size-box-wrap">${rows}</div>
        <button type="button" class="btn-primary" id="cf-save-btn">Save Cutting Issue — Auto-match PO/Country</button>
        <div class="msg" id="cf-msg"></div>
        <div id="cf-result"></div>
      `;
      document.getElementById('cf-save-btn').onclick = async ()=>{
        const date = document.getElementById('cf-date').value;
        const lineNo = document.getElementById('cf-line').value;
        const issuedTo = `${COMPANY.issuedTo} - LINE-${lineNo}`;
        const msg = document.getElementById('cf-msg');
        const resultBox = document.getElementById('cf-result');
        if(!date){ msg.textContent='Please enter a date.'; msg.className='msg err show'; resultBox.innerHTML=''; return; }
        const sizeQtyMap = {};
        dynamicBox.querySelectorAll('.cf-qty-input').forEach(inp=>{
          const v = inp.value.trim();
          if(v!=='' && Number(v)>0){ sizeQtyMap[inp.dataset.size] = Number(v); }
        });
        if(Object.keys(sizeQtyMap).length===0){ msg.textContent='Please enter quantity for at least one size.'; msg.className='msg err show'; resultBox.innerHTML=''; return; }

        const allocationResult = allocateForFile(fileNumber, sizeQtyMap, origin);

        // group allocations by orderId to create cutting entries
        const byOrder = {};
        allocationResult.forEach(r=>{
          r.allocations.forEach(a=>{
            if(!byOrder[a.orderId]) byOrder[a.orderId] = [];
            byOrder[a.orderId].push({size:r.size, qty:a.qty});
          });
        });
        const createdEntriesByOrder = {};
        Object.keys(byOrder).forEach(orderId=>{
          const entry = {id:uid(), orderId, date, sizes:byOrder[orderId], createdAt:Date.now(), challanId:null};
          ENTRIES.push(entry);
          createdEntriesByOrder[orderId] = entry;
        });
        await saveEntries();

        // group by PO NUMBER (not by order) — one challan per PO, all its countries combined as rows
        const byPo = {};
        Object.keys(byOrder).forEach(orderId=>{
          const order = ORDERS.find(o=>o.id===orderId);
          if(!order) return;
          if(!byPo[order.po]) byPo[order.po] = [];
          byOrder[orderId].forEach(s=>{
            byPo[order.po].push({country:order.country, origin:order.origin||'COMMON', size:s.size, qty:s.qty, color:order.color||''});
          });
        });

        const newChallans = [];
        for(const po of Object.keys(byPo)){
          // the challan number reserved via "New" is used for the first challan of this save; extra POs get fresh numbers
          const challanNo = pendingChallanNo || await nextChallanNo();
          pendingChallanNo = null;
          const challan = {
            id: uid(),
            challanNo,
            date,
            issuedTo,
            fileNumber,
            po,
            rows: byPo[po].slice(),
            createdAt: Date.now()
          };
          CHALLANS.push(challan);
          newChallans.push(challan);
          // tag the entries created for orders under this PO with this challan's id, so edits can re-sync them
          Object.keys(byOrder).forEach(orderId=>{
            const order = ORDERS.find(o=>o.id===orderId);
            if(order && order.po===po && createdEntriesByOrder[orderId]){
              createdEntriesByOrder[orderId].challanId = challan.id;
            }
          });
        }
        await saveChallans();
        await saveEntries();
        challanDisplay.textContent = 'Will be assigned on save';

        // build result summary
        const summaryHtml = allocationResult.map(r=>{
          const allocLines = r.allocations.map(a=>
            `<div>→ <b>${a.qty} pcs</b> allocated to PO <b>${escapeHtml(a.po)}</b> / <b>${escapeHtml(a.country)}</b> (cutting date ${a.date})</div>`
          ).join('');
          return `
            <div style="margin-bottom:10px;">
              <div style="font-weight:900;">Size ${escapeHtml(String(r.size))}:</div>
              ${allocLines || '<div>No PO had remaining requirement.</div>'}
              ${r.unallocated>0 ? `<div style="color:var(--red);font-weight:800;">⚠ ${r.unallocated} pcs could not be allocated — all matching POs in this file are already complete for size ${escapeHtml(String(r.size))}.</div>` : ''}
            </div>
          `;
        }).join('');

        const challanCards = newChallans.map(ch=>{
          const countries = [...new Set(ch.rows.map(r=>r.country))].join(', ');
          return `
          <div class="challan-card">
            <div>
              <div class="cno">Challan No: ${ch.challanNo}</div>
              <div class="cmeta">File ${escapeHtml(ch.fileNumber)} — PO ${escapeHtml(ch.po)} — Countries: ${escapeHtml(countries)}</div>
            </div>
            <button type="button" class="print-btn" data-challan-id="${ch.id}">Print Challan</button>
          </div>
        `;}).join('');

        resultBox.innerHTML = `
          <div class="msg show" style="display:block;">${summaryHtml}</div>
          <label style="margin-top:16px;">Challans Generated — Print</label>
          ${challanCards}
        `;
        resultBox.querySelectorAll('.print-btn').forEach(btn=>{
          btn.onclick = ()=>{
            const ch = CHALLANS.find(c=>c.id===btn.dataset.challanId);
            if(ch) openPrintChallan(ch);
          };
        });

        msg.textContent = 'Cutting issue saved and challan generated.';
        msg.className='msg show';

        dynamicBox.querySelectorAll('.cf-qty-input').forEach(inp=> inp.value='');
      };
    }

    function showForm(fileNumber){
      formBox.innerHTML = `
        <label>Origin</label>
        <select id="cf-origin">
          <option value="COMMON">Common</option>
          <option value="MADE IN INDIA">Made In India</option>
        </select>
        <div id="cf-dynamic"></div>
      `;
      const dynamicBox = document.getElementById('cf-dynamic');
      const originSelect = document.getElementById('cf-origin');
      renderDynamic(fileNumber, originSelect.value, dynamicBox);
      originSelect.onchange = ()=> renderDynamic(fileNumber, originSelect.value, dynamicBox);
    }

    const fileInput = document.getElementById('cf-file');
    fileInput.oninput = ()=>{
      const fn = fileInput.value.trim();
      if(!fn){ formBox.innerHTML=''; return; }
      const list = ordersInFile(fn);
      if(list.length===0){
        formBox.innerHTML = '<div class="empty">No PO/Order found under this File Number.</div>';
        return;
      }
      showForm(fn);
    };
  }

  function renderEditMode(challan){
    challanDisplay.textContent = challan.challanNo + ' (editing)';
    const sizeSet = [];
    challan.rows.forEach(r=>{ if(!sizeSet.includes(r.size)) sizeSet.push(r.size); });
    sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));
    const byCountry = {}; const countryOrder = [];
    challan.rows.forEach(r=>{
      if(!byCountry[r.country]){ byCountry[r.country]=[]; countryOrder.push(r.country); }
      byCountry[r.country].push(r);
    });

    const rowsHtml = countryOrder.map(country=>{
      const list = byCountry[country];
      const bySize = {}; list.forEach(r=>bySize[r.size]=r.qty);
      const boxes = sizeSet.map(sz=>`
        <div class="size-box">
          <span class="cf-label">${escapeHtml(String(sz))}</span>
          <input type="number" class="edit-qty-input" data-country="${escapeHtml(country)}" data-size="${escapeHtml(String(sz))}" value="${bySize[sz]!==undefined ? bySize[sz] : ''}" min="0">
        </div>
      `).join('');
      const originLabel = list[0].origin==='MADE IN INDIA' ? ' — Made In India' : '';
      return `<div style="margin-bottom:14px;"><label>${escapeHtml(country)}${originLabel}</label><div class="size-box-wrap">${boxes}</div></div>`;
    }).join('');

    bodyBox.innerHTML = `
      <div class="challan-card" style="cursor:default;">
        <div>
          <div class="cno">File ${escapeHtml(challan.fileNumber)} — PO ${escapeHtml(challan.po)}</div>
          <div class="cmeta">Date: ${challan.date} — Issued To: ${escapeHtml(challan.issuedTo||'')}</div>
        </div>
        <button type="button" class="print-btn" id="cf-edit-print-btn">Print</button>
      </div>
      <label>Edit Size-wise Quantity</label>
      ${rowsHtml}
      <button type="button" class="btn-primary" id="cf-edit-save-btn">Save Changes</button>
      <button type="button" class="add-size-btn" id="cf-edit-cancel-btn" style="width:100%;margin-top:8px;">Cancel — Back to New Entry</button>
      <div class="msg" id="cf-edit-msg"></div>
    `;

    document.getElementById('cf-edit-print-btn').onclick = ()=> openPrintChallan(challan);
    document.getElementById('cf-edit-cancel-btn').onclick = ()=>{ challanDisplay.textContent = pendingChallanNo ? (pendingChallanNo+' (new — not yet saved)') : 'Will be assigned on save'; renderCreateMode(); };

    document.getElementById('cf-edit-save-btn').onclick = async ()=>{
      const newRows = [];
      bodyBox.querySelectorAll('.edit-qty-input').forEach(inp=>{
        const v = inp.value.trim();
        const qty = Number(v);
        if(v!=='' && qty>0){
          const country = inp.dataset.country;
          const meta = byCountry[country][0];
          newRows.push({country, origin:meta.origin, size:inp.dataset.size, qty, color:meta.color});
        }
      });
      challan.rows = newRows;
      await saveChallans();

      // re-sync the cutting entries tied to this challan so remaining-quantity tracking stays accurate
      ENTRIES = ENTRIES.filter(e=> e.challanId !== challan.id);
      const grouped = {};
      newRows.forEach(r=>{
        const order = ORDERS.find(o=> o.fileNumber===challan.fileNumber && o.po===challan.po && o.country===r.country);
        if(!order) return;
        if(!grouped[order.id]) grouped[order.id]=[];
        grouped[order.id].push({size:r.size, qty:r.qty});
      });
      Object.keys(grouped).forEach(orderId=>{
        ENTRIES.push({id:uid(), orderId, date:challan.date, sizes:grouped[orderId], createdAt:Date.now(), challanId:challan.id});
      });
      await saveEntries();

      const msg = document.getElementById('cf-edit-msg');
      msg.textContent = 'Challan updated.';
      msg.className = 'msg show';
    };
  }

  document.getElementById('cf-new-btn').onclick = async ()=>{
    pendingChallanNo = await nextChallanNo();
    renderCreateMode();
  };

  document.getElementById('cf-edit-search').addEventListener('change', (e)=>{
    const val = e.target.value.trim();
    const ch = CHALLANS.find(x=>x.challanNo===val);
    if(ch) renderEditMode(ch);
  });

  renderCreateMode();
}

/* ---------- TAB: ISSUED CUTTING (actual quantities cut so far, by File → PO → Origin) ---------- */
function buildIssuedCuttingHtml(fileNumber){
  const list = ORDERS.filter(o=>o.fileNumber===fileNumber);
  if(list.length===0) return '';

  const poOrder = [];
  const byPo = {};
  list.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>{
    if(!byPo[o.po]){ byPo[o.po]=[]; poOrder.push(o.po); }
    byPo[o.po].push(o);
  });

  const poBlocks = poOrder.map(po=>{
    const orders = byPo[po];
    const sizeSet = [];
    orders.forEach(o=> o.sizes.forEach(s=>{ if(!sizeSet.includes(s.size)) sizeSet.push(s.size); }));
    sizeSet.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));

    const commonTotals = {}; const miiTotals = {};
    sizeSet.forEach(s=>{ commonTotals[s]=0; miiTotals[s]=0; });
    orders.forEach(o=>{
      const issued = issuedForOrder(o.id);
      const bucket = (o.origin==='MADE IN INDIA') ? miiTotals : commonTotals;
      sizeSet.forEach(s=>{ bucket[s] += Number(issued[s]||0); });
    });

    const commonRowTotal = sizeSet.reduce((s,sz)=>s+commonTotals[sz],0);
    const miiRowTotal = sizeSet.reduce((s,sz)=>s+miiTotals[sz],0);
    const grand = commonRowTotal + miiRowTotal;

    const sizeHeadHtml = sizeSet.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('');
    const commonCells = sizeSet.map(sz=>`<td>${commonTotals[sz]}</td>`).join('');
    const miiCells = sizeSet.map(sz=>`<td>${miiTotals[sz]}</td>`).join('');
    const totalCells = sizeSet.map(sz=>`<td>${commonTotals[sz]+miiTotals[sz]}</td>`).join('');

    return `
      <div class="issued-po-block">
        <div class="issued-po-title">(${escapeHtml(po)})</div>
        <table class="issued-table">
          <tr><th>&nbsp;</th>${sizeHeadHtml}<th>Total</th></tr>
          <tr class="row-common"><td>Common</td>${commonCells}<td><b>${commonRowTotal}</b></td></tr>
          <tr class="row-mii"><td>Made In India</td>${miiCells}<td><b>${miiRowTotal}</b></td></tr>
          <tr class="row-total"><td>Total Cutting</td>${totalCells}<td>${grand}</td></tr>
        </table>
      </div>
    `;
  }).join('');

  return `
    <div class="issued-doc">
      <div class="issued-file-title">File Number: ${escapeHtml(fileNumber)}</div>
      ${poBlocks}
    </div>
  `;
}

function renderIssuedCutting(){
  const c = document.getElementById('content');
  const fileNumbers = [...new Set(ORDERS.map(o=>o.fileNumber).filter(Boolean))].sort();
  c.innerHTML = `
    <h2 class="section-title">Issued Cutting</h2>
    <label>File Number</label>
    <input type="text" id="ic-file" placeholder="Enter file number" list="ic-file-list">
    <datalist id="ic-file-list">${fileNumbers.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>

      container.innerHTML = '<div class="empty">No orders found under this File Number.</div>';

}

/* ---------- TAB: DAILY SCHEDULE ---------- */
function renderDate(){
  const c = document.getElementById('content');
  const today = new Date().toISOString().slice(0,10);
  c.innerHTML = `
    <h2 class="section-title">Daily Schedule — Multiple Countries</h2>
    <label>Select Date</label>
    <input type="date" id="dv-date" value="${today}">
    <div id="dv-container" style="margin-top:16px;"></div>
  `;
  const draw = ()=>{
    const date = document.getElementById('dv-date').value;
    const list = ORDERS.filter(o=>o.date===date);
    const cont = document.getElementById('dv-container');
    if(list.length===0){
      cont.innerHTML = '<div class="empty">No orders scheduled on this date.</div>';
      return;
    }
    const byCountry = {};
    list.forEach(o=>{ (byCountry[o.country] = byCountry[o.country]||[]).push(o); });
    cont.innerHTML = Object.keys(byCountry).sort().map(country=>{
      const orders = byCountry[country];
      const cards = orders.map(o=>{
        const st = orderStatus(o);
        return `
          <div class="ticket">
            <div class="ticket-head">
              <span class="po">File: ${escapeHtml(o.fileNumber||'—')} &nbsp;|&nbsp; PO: ${escapeHtml(o.po)}</span>
              <span class="qty-badge" style="background:var(--paper);color:var(--ink);">${st.done}/${st.target}</span>
            </div>
            <div class="ticket-body">
              <span class="status-pill ${st.cls}">${st.label}</span>
            </div>
          </div>
        `;
      }).join('');
      return `<div class="date-group"><h3>Country: ${escapeHtml(country)} (${orders.length} PO)</h3>${cards}</div>`;
    }).join('');
  };
  document.getElementById('dv-date').onchange = draw;
  draw();
}

/* ---------- CHALLAN PRINT ---------- */
function buildChallanHtml(challan){
  // Pivot: sizes become columns, one row per country (horizontal size breakup)
  const sizeOrder = [];
  challan.rows.forEach(r=>{ if(!sizeOrder.includes(r.size)) sizeOrder.push(r.size); });
  sizeOrder.sort((a,b)=> (Number(a)-Number(b)) || String(a).localeCompare(String(b)));

  const byCountry = {};
  const countryOrder = [];
  challan.rows.forEach(r=>{
    if(!byCountry[r.country]){ byCountry[r.country]=[]; countryOrder.push(r.country); byCountry[r.country]._color = r.color||''; byCountry[r.country]._origin = r.origin||'COMMON'; }
    byCountry[r.country].push(r);
  });

  const sizeHeadHtml = sizeOrder.map(sz=>`<th>${escapeHtml(String(sz))}</th>`).join('');
  const colTotals = {}; sizeOrder.forEach(sz=> colTotals[sz]=0);
  let grandTotal = 0;

  const bodyRowsHtml = countryOrder.map((country,i)=>{
    const list = byCountry[country];
    const bySize = {}; list.forEach(r=> bySize[r.size]=Number(r.qty));
    let rowTotal = 0;
    const sizeCellsHtml = sizeOrder.map(sz=>{
      const q = bySize[sz]||0;
      rowTotal += q; colTotals[sz]+=q;
      return `<td>${q>0?q:'-'}</td>`;
    }).join('');
    grandTotal += rowTotal;
    const originSuffix = list._origin === 'MADE IN INDIA' ? ' - MADE IN INDIA' : '';
    return `
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(challan.fileNumber)}</td>
        <td class="desc">CUTTING - ISSUE - (${escapeHtml(country)} - ${escapeHtml(challan.po)})${originSuffix}</td>
        <td></td>
        ${sizeCellsHtml}
        <td><b>${rowTotal}</b></td>
        <td>PCS</td>
        <td>${escapeHtml(list._color||'')}</td>
      </tr>
    `;
  }).join('');

  const totalRowCells = sizeOrder.map(sz=>`<td>${colTotals[sz]}</td>`).join('');

  return `
    <div class="challan-doc">
      <p class="co-name">${escapeHtml(COMPANY.name)}</p>
      <p class="co-addr">${escapeHtml(COMPANY.addr)}</p>
      <p class="co-gst">${escapeHtml(COMPANY.gst)}</p>
      <div class="ch-top">
        <div>
          <div class="ch-meta-line"><b>No:</b> ${escapeHtml(challan.challanNo)}</div>
          <div class="ch-meta-line"><b>Date:</b> ${challan.date}</div>
        </div>
        <div>
          <div class="ch-meta-line"><b>Issued To:</b> ${escapeHtml(challan.issuedTo||'')}</div>
          <div class="ch-meta-line">${escapeHtml(COMPANY.addr)}</div>
          <div class="ch-meta-line"><b>GST No:</b> ${escapeHtml(COMPANY.gst)}</div>
        </div>
      </div>
      <div class="ch-title">Inhouse / Inter Unit Transfer Challan</div>
      <div class="ch-meta-line">Vehicle No: ______________&nbsp;&nbsp;&nbsp; Driver Name: ______________&nbsp;&nbsp;&nbsp; EWay No: ______________</div>
      <table class="challan-table">
        <tr>
          <th>SL.<br>NO</th><th>FILE<br>NO</th><th>Item Description</th><th>HSN</th>${sizeHeadHtml}<th>Total</th><th>Unit</th><th>Color</th>
        </tr>
        ${bodyRowsHtml}
        <tr class="total-row">
          <td colspan="4">Total :-</td>
          ${totalRowCells}
          <td>${grandTotal}</td>
          <td colspan="2"></td>
        </tr>
      </table>
      <div class="remarks">Remarks: ____________________________________________</div>
      <div class="challan-sign">
        <div>Prepared By</div>
        <div>Received By</div>
        <div>Authorized By</div>
      </div>
    </div>
  `;
}

function openPrintHtml(html){
  const overlay = document.getElementById('print-overlay');
  document.getElementById('print-area').innerHTML = html;
  overlay.classList.add('show');
}

function openPrintChallan(challan){
  const single = buildChallanHtml(challan);
  openPrintHtml(`<div class="challan-page">${single}${single}</div>`);
}

/* ---------- TAB: CHALLANS (history) ---------- */
function renderChallans(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <h2 class="section-title">All Challans</h2>
    <div class="filters">
      <input type="text" id="ch-filt-file" placeholder="File Number">
      <input type="text" id="ch-filt-po" placeholder="PO Number">
      <input type="date" id="ch-filt-date">
    </div>
    <div id="challans-container"></div>
  `;
  const draw = ()=>{
    const ff = document.getElementById('ch-filt-file').value.trim().toLowerCase();
    const fp = document.getElementById('ch-filt-po').value.trim().toLowerCase();
    const fd = document.getElementById('ch-filt-date').value;
    let list = CHALLANS.filter(ch=>{
      if(ff && !ch.fileNumber.toLowerCase().includes(ff)) return false;
      if(fp && !ch.po.toLowerCase().includes(fp)) return false;
      if(fd && ch.date !== fd) return false;
      return true;
    }).sort((a,b)=> b.createdAt - a.createdAt);
    const cont = document.getElementById('challans-container');
    if(list.length===0){ cont.innerHTML = '<div class="empty">No challans generated yet.</div>'; return; }
    cont.innerHTML = list.map(ch=>{
      const totalQty = ch.rows.reduce((s,r)=>s+Number(r.qty),0);
      const countries = [...new Set(ch.rows.map(r=>r.country))].join(', ');
      return `
        <div class="challan-card">
          <div>
            <div class="cno">Challan No: ${escapeHtml(ch.challanNo)} — ${ch.date}</div>
            <div class="cmeta">File ${escapeHtml(ch.fileNumber)} — PO ${escapeHtml(ch.po)} — Countries: ${escapeHtml(countries)} — ${totalQty} pcs</div>
          </div>
          <button type="button" class="print-btn" data-id="${ch.id}">Print / Reprint</button>
        </div>
      `;
    }).join('');
    cont.querySelectorAll('.print-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const ch = CHALLANS.find(x=>x.id===btn.dataset.id);
        if(ch) openPrintChallan(ch);
      };
    });
  };
  document.getElementById('ch-filt-file').oninput = draw;
  document.getElementById('ch-filt-po').oninput = draw;
  document.getElementById('ch-filt-date').oninput = draw;
  draw();
}

const renderers = { dashboard: renderDashboard, new: renderNew, list: renderList, cut: renderCut, issued: renderIssuedCutting, date: renderDate, challans: renderChallans, settings: renderSettings };

const PAGE_META = {
  dashboard: ['Dashboard', 'Overview of your cutting operations'],
  new: ['Add Order', 'Create a new File / PO / Country entry'],
  list: ['Order Sheet', 'Size-wise breakdown grouped by File and PO'],
  cut: ['Cutting Issue', 'Record cutting issue and manage challans'],
  issued: ['Issued Cutting', 'Actual quantities cut, by File and PO'],
  date: ['Daily Schedule', 'Cutting scheduled across countries by date'],
  challans: ['Challans', 'All generated inhouse transfer challans'],
  settings: ['Settings', 'Company details and preferences']
};

function setHeader(name){
  const meta = PAGE_META[name] || ['Cutting Tracker', ''];
  const titleEl = document.getElementById('page-title');
  const subEl = document.getElementById('page-subtitle');
  if(titleEl) titleEl.textContent = meta[0];
  if(subEl) subEl.textContent = meta[1];
}

function switchTab(name){
  document.querySelectorAll('.nav-item[data-tab]').forEach(t=> t.classList.toggle('active', t.dataset.tab===name));
  setHeader(name);
  renderers[name]();
}

function bindTabs(){
  document.querySelectorAll('.nav-item[data-tab]').forEach(tab=>{
    tab.onclick = ()=> switchTab(tab.dataset.tab);
  });
}

function bindPrintOverlay(){
  document.getElementById('do-print-btn').onclick = ()=> window.print();
  document.getElementById('close-print-btn').onclick = ()=>{
    document.getElementById('print-overlay').classList.remove('show');
  };
}

/* ---------- Theme (light/dark) ---------- */
async function loadTheme(){
  try{
    const t = await window.storage.get('ui-theme-pref', false);
    return t ? JSON.parse(t.value).theme : 'light';
  }catch(e){ return 'light'; }
}
async function saveTheme(theme){
  try{ await window.storage.set('ui-theme-pref', JSON.stringify({theme}), false); }
  catch(e){ /* ignore */ }
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle-btn');
  if(btn) btn.lastChild.textContent = theme==='dark' ? ' Light Mode' : ' Dark Mode';
}
function bindThemeToggle(){
  const btn = document.getElementById('theme-toggle-btn');
  btn.onclick = async ()=>{
    const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    applyTheme(next);
    await saveTheme(next);
  };
}

/* ---------- Global header search — jumps to Order Sheet filtered by the query ---------- */
function bindGlobalSearch(){
  const input = document.getElementById('global-search');
  input.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const q = input.value.trim();
    if(!q) return;
    switchTab('list');
    setTimeout(()=>{
      const fileEl = document.getElementById('filt-file');
      if(fileEl){ fileEl.value = q; fileEl.dispatchEvent(new Event('input')); }
    }, 0);
  });
}

async function startApp(){
  bindTabs();
  bindPrintOverlay();
  bindThemeToggle();
  bindGlobalSearch();
  const theme = await loadTheme();
  applyTheme(theme);
  await loadAll();
  if(ORDERS.length===0){ await seedTrialData(); }
  else { await seedMiiExample(); }
  setHeader('dashboard');
  renderDashboard();
}

  }
  function tryLogin(){
    if(idEl.value.trim().toLowerCase() === LOGIN_ID && pwEl.value === LOGIN_PASS){
      try{ sessionStorage.setItem('ct-auth','1'); }catch(e){}
      errEl.textContent = '';
      enter();
    }else{
      errEl.textContent = 'Wrong Login ID or Password';
      errEl.classList.remove('shake'); void errEl.offsetWidth; errEl.classList.add('shake');
      pwEl.value = ''; pwEl.focus();
    }
  }
  document.getElementById('login-btn').addEventListener('click', tryLogin);
  [idEl,pwEl].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); }));
  document.getElementById('login-eye').addEventListener('click', function(){
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
  });
  document.getElementById('logout-btn').addEventListener('click', function(){
    try{ sessionStorage.removeItem('ct-auth'); }catch(e){}
    location.reload();
  });

  let authed = false;
  try{ authed = sessionStorage.getItem('ct-auth') === '1'; }catch(e){}
  if(authed){ enter(); } else { idEl.focus(); }
})();
